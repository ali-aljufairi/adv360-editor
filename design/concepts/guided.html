<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keymap Guide · Advantage360 Pro</title>
<meta name="description" content="A guided, plain-language keymap editor for the Kinesis Advantage360 Pro. Concept mockup.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;650;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF5EC; --surface:#FFFDF9; --surface2:#FAF3E7; --bg2:#F3E9D8;
  --ink:#2B2119; --ink2:#5E5043; --muted:#8A7A69; --line:#E8DCCB;
  --accent:#CC5F36; --accent-ink:#FFF8F1; --accent-soft:#F8E0D2;
  --good:#2F7D62; --good-soft:#DCEFE5; --warn:#9A6212; --warn-soft:#FBEBC8;
  --bad:#B1372A; --bad-soft:#F8DAD3; --info:#3566A0; --info-soft:#DDE8F5;
  --cap:#FFFDF8; --cap-edge:#DCC9AE; --cap-shadow:#D8C6AA;
  --cap-hold:#D3EADF; --cap-layer:#FAE4AE; --cap-macro:#E4D8F3; --cap-sys:#D5E4F3; --cap-danger:#F5CBC1; --cap-faint:#EFE6D8;
  --hl:#23866F; --sel:#CC5F36;
  --code:#2B2119; --code-ink:#F3E9D9; --add:#A8E4C6; --del:#F5A899;
  --r:24px;
  --shadow:0 1px 0 rgba(43,33,25,.04),0 16px 34px -22px rgba(74,44,16,.4);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --t1:#CC5F36; --t2:#2F8F7A; --t3:#8256B0; --t4:#3566A0; --t5:#B07116; --t6:#5C8A3A;
}
[data-theme="dark"]{
  --bg:#1A1510; --surface:#261E17; --surface2:#2C241C; --bg2:#33291F;
  --ink:#F6ECDE; --ink2:#D3C4B0; --muted:#A09080; --line:#3E3429;
  --accent:#F08A5D; --accent-ink:#2A130A; --accent-soft:#4A2C1F;
  --good:#7CCBA9; --good-soft:#1E3A30; --warn:#F0C061; --warn-soft:#3F3119;
  --bad:#F08B7C; --bad-soft:#4A2521; --info:#8DB8EA; --info-soft:#1E2D40;
  --cap:#3A3026; --cap-edge:#55493A; --cap-shadow:#120D09;
  --cap-hold:#244A3F; --cap-layer:#5A4420; --cap-macro:#3E3459; --cap-sys:#22405C; --cap-danger:#5C2B24; --cap-faint:#2B241D;
  --hl:#6CD3B5; --sel:#F08A5D;
  --code:#100C09; --code-ink:#F3E9D9; --add:#8FE0B8; --del:#F5A899;
  --shadow:0 18px 36px -24px rgba(0,0,0,.7);
  --t1:#F08A5D; --t2:#6CC3AE; --t3:#B99AE0; --t4:#8DB8EA; --t5:#F0C061; --t6:#A3D08A;
}
*{box-sizing:border-box}
.home>*,.flow-grid>*,.tasks>*,.flow-main,.board-card,.board-scroll,.step-card{min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.3px);background-size:24px 24px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-.015em;line-height:1.12;margin:0}
p{margin:0 0 10px}
code{font-family:var(--mono);font-size:.88em;background:var(--bg2);padding:1px 6px;border-radius:7px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.ico{width:22px;height:22px;flex:none}
.link{color:var(--accent);font-weight:650;text-decoration:underline;text-underline-offset:3px;padding:0}

/* ---------- top bar ---------- */
.app{max-width:1320px;margin:0 auto;padding:18px 28px 130px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 26px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{display:block;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:13px}
.logo{width:42px;height:42px;flex:none}
.top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.theme{display:inline-flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;color:var(--ink2);font-weight:600}
.theme .knob{width:38px;height:22px;border-radius:999px;background:var(--bg2);position:relative;transition:background .2s}
.theme .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:transform .2s}
.theme[aria-pressed="true"] .knob::after{transform:translateX(16px)}

/* ---------- hero + home ---------- */
.hero{margin-bottom:22px}
.hero h1{font-size:clamp(34px,4.6vw,54px);margin-bottom:12px}
.hero h1 em{font-style:italic;color:var(--accent);font-weight:500}
.lede{color:var(--ink2);font-size:17px;max-width:62ch;margin:0}
.heads-up{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin:0 0 24px;font-size:14px;color:var(--ink2)}
.heads-up b{color:var(--ink)}
.home{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:28px;align-items:start}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.task{--t:var(--t1);position:relative;display:flex;flex-direction:column;align-items:stretch;gap:16px;text-align:left;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .18s,border-color .18s;min-height:196px}
.task:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--t) 55%,var(--line))}
.task.t1{--t:var(--t1)}.task.t2{--t:var(--t2)}.task.t3{--t:var(--t3)}.task.t4{--t:var(--t4)}.task.t5{--t:var(--t5)}.task.t6{--t:var(--t6)}
.task.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:0}
.task .ico-wrap{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 17%,transparent);color:var(--t);flex:none}
.task.wide .ico-wrap{width:56px;height:56px}
.task .tt{display:block}
.task b{display:block;font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.task p{margin:0;color:var(--ink2);font-size:14px;line-height:1.45}
.task .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.task.wide .foot{margin-top:0}
.task .prob-line{display:block;margin-top:8px;font-size:14px;color:var(--bad);font-weight:600;line-height:1.4}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.task.wide .badge{margin-left:auto}
.pathline{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;font-size:13px;color:var(--muted);align-items:center}
.pathline span{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.pathline i{font-style:normal;color:var(--line)}

/* ---------- board ---------- */
.board-card{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:20px 20px 16px;box-shadow:var(--shadow);position:sticky;top:16px}
.board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.board-head h3{font-size:25px;margin-top:2px}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{position:relative;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:650;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 2px 6px -3px rgba(0,0,0,.25)}
.dot-warn{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.board-scroll{border-radius:20px;padding:10px;background:var(--surface2);border:1px solid var(--line)}
.board-scroll svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:13px;height:13px;border-radius:4px;border:1px solid var(--cap-edge);display:inline-block}
.sw-key{background:var(--cap)}.sw-hold{background:var(--cap-hold)}.sw-layer{background:var(--cap-layer)}.sw-macro{background:var(--cap-macro)}.sw-sys{background:var(--cap-sys)}.sw-danger{background:var(--cap-danger)}.sw-faint{background:var(--cap-faint)}
.k{cursor:pointer}
.k .sh{fill:var(--cap-shadow)}
.k .cap{fill:var(--cap);stroke:var(--cap-edge);stroke-width:.035;transition:stroke .15s}
.k-hold .cap{fill:var(--cap-hold)}.k-layer .cap{fill:var(--cap-layer)}.k-macro .cap{fill:var(--cap-macro)}
.k-sys .cap{fill:var(--cap-sys)}.k-danger .cap{fill:var(--cap-danger)}.k-faint .cap{fill:var(--cap-faint)}
.k text{font-family:var(--body);font-weight:650;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.k text.sub{font-weight:500;fill:var(--ink2)}
.k-faint text{fill:var(--muted)}
.k:hover .cap{stroke:var(--accent)}
.k:focus{outline:none}.k:focus .cap{stroke:var(--accent);stroke-width:.08}
.is-sel .cap{stroke:var(--sel);stroke-width:.09}
.is-hl .cap{stroke:var(--hl);stroke-width:.1}
.is-hl .sh{fill:var(--hl)}
.hold-dot{fill:var(--good)}
.chg{fill:var(--accent);stroke:var(--surface);stroke-width:.02}

/* ---------- callouts, options, buttons ---------- */
.callout{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:18px;font-size:14px;margin:14px 0;background:var(--info-soft);color:var(--ink)}
.callout.warn{background:var(--warn-soft)}
.callout.bad{background:var(--bad-soft)}
.callout.good{background:var(--good-soft)}
.callout.info{background:var(--info-soft)}
.callout .ico{width:20px;height:20px;margin-top:1px}
.callout b{font-weight:700}
.never{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:22px;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 35%,transparent);margin-top:18px}
.never .ico{width:28px;height:28px;color:var(--good);margin-top:2px}
.never b{display:block;font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:4px}
.never p{margin:0;color:var(--ink2);font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:15px;font-weight:650;font-size:15px;border:1px solid var(--line);background:var(--surface);transition:transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 10px 20px -12px var(--accent)}
.btn.ghost{background:transparent}
.btn.big{padding:15px 24px;font-size:16px}
.btn.small{padding:7px 12px;font-size:13px;border-radius:11px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.opts.scroll{max-height:300px;overflow:auto;padding:2px}
.opt{text-align:left;padding:12px 14px;border-radius:17px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
.opt b{font-weight:650}
.opt span{font-size:12.5px;color:var(--muted);font-family:var(--body)}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.opt.wide{grid-column:1/-1;padding:16px 18px}
.opt.wide b{font-size:16px}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.kind{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px;border-radius:19px;border:1px solid var(--line);background:var(--surface2)}
.kind .ico{color:var(--accent)}
.kind b{font-weight:650}
.kind small{color:var(--muted);font-size:12.5px;line-height:1.35}
.kind.on{border-color:var(--accent);background:var(--accent-soft)}
.search{display:block;margin:6px 0 12px}
.search input{width:100%;padding:13px 15px;border-radius:15px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:15px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.results{margin-bottom:6px}
.now{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 16px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);margin:10px 0 4px}
.now b{font-family:var(--display);font-size:20px;font-weight:600}
.now span.plain{flex-basis:100%;color:var(--ink2);font-size:14px}
.pill{display:inline-flex;font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--ink2)}
.tag{font-style:normal;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--ink2)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.concept{margin-top:16px;padding:20px 22px;border-radius:24px;background:var(--accent-soft);color:var(--ink)}
.concept h4{font-size:18px;margin-bottom:8px}
.concept p{color:var(--ink);font-size:14.5px;margin:0 0 8px}
.concept p:last-child{margin:0}
.concept b{font-weight:700}

/* ---------- flow ---------- */
.flow-top{margin-bottom:18px}
.back-link{color:var(--muted);font-size:14px;font-weight:600;padding:0;margin-bottom:10px;display:inline-block}
.flow-top h1{font-size:38px;margin-bottom:16px}
.stepper{list-style:none;display:flex;gap:8px;padding:0;margin:0;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);padding:5px 13px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.stepper li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);font-weight:700;font-size:12px;color:var(--ink2)}
.stepper li.cur{color:var(--ink);border-color:var(--accent)}
.stepper li.cur span{background:var(--accent);color:var(--accent-ink)}
.stepper li.done span{background:var(--good-soft);color:var(--good)}
.flow-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start}
.flow-grid.solo{grid-template-columns:minmax(0,760px)}
.step-card{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:30px;box-shadow:var(--shadow)}
.step-card h2{font-size:31px;margin-bottom:14px}
.step-card > p{color:var(--ink2);font-size:15.5px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.flow-side{position:sticky;top:16px}
.home-board .board-card{position:static}
.flow-side .board-card{position:static}
.review-h{font-family:var(--display);font-size:24px;margin:4px 0 10px}
.sum{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:10px}
.sum li{padding:16px 18px;border-radius:20px;background:var(--surface2);border:1px solid var(--line)}
.sum li b{font-family:var(--display);font-size:18px;font-weight:600;display:block;line-height:1.3}
.sum li small{display:block;color:var(--ink2);font-size:13.5px;margin-top:4px}
.from-to{font-size:17px;margin:6px 0 0}
details.raw{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
details.raw summary{cursor:pointer;color:var(--ink2);font-weight:650;font-size:14px}
.hunk{margin-top:10px}
.hunk-h{font-size:12px;color:var(--muted);margin-bottom:4px;font-family:var(--mono)}
.diff{font:12.5px/1.6 var(--mono);background:var(--code);color:var(--code-ink);border-radius:16px;padding:12px 14px;overflow-x:auto;margin:0}
.diff span{display:block;white-space:pre;width:max-content;min-width:100%}
.diff .del{color:var(--del)}
.diff .add{color:var(--add)}
.steps{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.step-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto auto;align-items:center;gap:8px;padding:10px 12px;border-radius:17px;background:var(--surface2);border:1px solid var(--line)}
.step-row .n{width:27px;height:27px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;font-size:13px}
.step-row .sn b{display:block;font-weight:650}
.step-row .sn small{font-family:var(--mono);color:var(--muted);font-size:12px}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:16px;display:grid;place-items:center}
.preview{margin:14px 0}
.typed{font:600 21px/1.4 var(--mono);padding:14px 16px;border-radius:18px;background:var(--surface2);border:1px dashed var(--line);min-height:58px;letter-spacing:.02em;word-break:break-all}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--accent);vertical-align:-.22em;margin:0 1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tpf{display:grid;gap:14px}
.tpf-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:650}
.tpf-row output{font-family:var(--display);font-size:26px;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
fieldset.flav{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
fieldset.flav legend{font-weight:650;margin-bottom:8px;padding:0}
.flav-o{position:relative;text-align:left;padding:13px 14px;border-radius:17px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:3px}
.flav-o b{font-weight:650}
.flav-o span{font-size:12.8px;color:var(--ink2);line-height:1.4}
.flav-o em{font-style:normal;font-size:11px;font-weight:700;color:var(--good);letter-spacing:.04em;text-transform:uppercase}
.flav-o.on{border-color:var(--accent);background:var(--accent-soft)}
.tryit{border-radius:22px;padding:16px;background:var(--surface2);border:1px solid var(--line)}
.hold-btn{width:100%;padding:22px 16px;border-radius:20px;background:var(--cap);border:1px solid var(--cap-edge);box-shadow:0 7px 0 var(--cap-shadow);font-weight:700;font-size:16px;transition:transform .08s,box-shadow .08s;color:var(--ink);user-select:none;touch-action:none}
.hold-btn.down{transform:translateY(6px);box-shadow:0 1px 0 var(--cap-shadow)}
.tryit p{margin:10px 0 0;font-size:14px;color:var(--ink2);text-align:center;min-height:21px}
.warn-line{font-size:13.5px;color:var(--warn);background:var(--warn-soft);padding:11px 13px;border-radius:15px;margin:0}
.prob{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:19px;border:1px solid var(--line);background:var(--surface2);margin-bottom:10px}
.prob b{display:block;font-weight:650;margin-bottom:2px}
.prob small{color:var(--ink2);font-size:13.5px;line-height:1.4;display:block}
.combos{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:10px}
.combo{width:100%;text-align:left;padding:15px 16px;border-radius:19px;border:1px solid var(--line);background:var(--surface2);display:grid;gap:4px}
.combo.on{border-color:var(--accent);background:var(--accent-soft)}
.combo-k{font-family:var(--display);font-size:19px;font-weight:600}
.combo b{font-weight:600;color:var(--ink2);font-size:14px}
.combo .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.field{display:grid;gap:6px;margin:14px 0;font-weight:650;font-size:14px}
.field input,.field textarea{font:inherit;font-weight:500;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:15px;padding:12px 14px;width:100%}
.field textarea{resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.jobs{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.jobs li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
.jobs .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.jobs .run .st{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.jobs .done .st{background:var(--good);border-color:var(--good);color:#fff}
.jobs .done{color:var(--ink2)}
@keyframes spin{to{transform:rotate(360deg)}}
.logs{font:12.5px/1.6 var(--mono);background:var(--code);color:var(--code-ink);border-radius:18px;padding:14px 16px;min-height:120px;white-space:pre-wrap}
.dl-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.dl{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:20px;background:var(--surface2);border:1px solid var(--line)}
.dl b{font-family:var(--mono);font-size:14px}
.dl span{font-size:13px;color:var(--ink2)}
.dl em{font-style:normal;margin-top:8px;color:var(--accent);font-weight:700}
.ro-list{display:grid;gap:8px;margin:12px 0}
.ro{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.ro b{font-weight:650}
.ro small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* ---------- tray + toast ---------- */
#tray{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:20;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 20px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:0 18px 36px -14px rgba(0,0,0,.45);font-weight:600;font-size:14.5px;white-space:nowrap}
#tray:empty{display:none}
#tray .btn{background:var(--accent);color:var(--accent-ink);border:0;padding:10px 16px;border-radius:999px;box-shadow:none}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:16px;box-shadow:var(--shadow);font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;z-index:30;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .home,.flow-grid{grid-template-columns:minmax(0,1fr)}
  .board-card{position:static}
  .flow-side{position:static}
  .home-board .board-card{position:static}
  .flow-grid.solo{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .app{padding:12px 16px 130px}
  .top{padding-bottom:16px}
  .brand small{display:none}
  .chip{display:none}
  .tasks{grid-template-columns:minmax(0,1fr)}
  .task{min-height:0}
  .task.wide{grid-column:auto;flex-direction:column;align-items:stretch}
  .task.wide .badge{margin-left:0}
  .hero h1{font-size:32px}
  .step-card{padding:20px}
  .step-card h2{font-size:25px}
  .flow-top h1{font-size:28px}
  .board-card{padding:14px 12px}
  .board-scroll{overflow-x:auto}
  .board-scroll svg{min-width:680px}
  fieldset.flav{grid-template-columns:1fr}
  .dl-cards{grid-template-columns:minmax(0,1fr)}
  .kinds{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  #tray{left:12px;right:12px;transform:none;justify-content:space-between;white-space:normal}
  #toast{bottom:86px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function keyName(c){
  const m = c.match(/^([LR][CSAG])\((.+)\)$/);
  if (m) return `${MOD[m[1]]}+${keyName(m[2])}`;
  if (NAMES[c]) return NAMES[c];
  let x = c.match(/^(?:N|NUMBER_)(\d)$/); if (x) return x[1];
  x = c.match(/^KP_N(\d)$/); if (x) return `Num ${x[1]}`;

}

const BL_NAMES = {BL_TOG:'Backlight on/off',BL_INC:'Backlight brighter',BL_DEC:'Backlight dimmer',BL_OFF:'Backlight off'};

/* describe(raw) -> what a binding means in plain words.
   t/s = text printed on the keycap, full = summary text, plain = explanation. */
function describe(raw){
  const [b, ...a] = raw.split(' ');
  const R = (kind, t, full, s='', plain='') => ({kind, t, full: full ?? t, s, plain});
  switch (b) {
    case '&kp': { const n = keyName(a[0]); return R('key', n, n, '', `Sends ${n} when pressed.`); }
    case '&tpf': { const h = keyName(a[0]), t = keyName(a[1]);
      return R('hold', t, `${t} (hold: ${h})`, `${h} hold`, `A quick tap sends ${t}. Holding it past the tapping term sends ${h}.`); }
    case '&mo': { const n = LAYER_SHORT[+a[0]]; return R('layer', n, `${n} (hold)`, '(hold)', `Hold it to use the ${n} layer. Let go to come back.`); }
    case '&tog': { const n = LAYER_SHORT[+a[0]]; return R('layer', n, `${n} (toggle)`, '(toggle)', `Press to switch the ${n} layer on. Press again to switch it off.`); }
    case '&trans': return R('faint', '▽', 'Pass-through', 'below', 'Does whatever the layer below does.');
    case '&none': return R('faint', '—', 'None', '', 'Does nothing on this layer.');
    case '&bt': return a[0] === 'BT_CLR'
      ? R('sys', 'BT clear', 'Clear Bluetooth pairings', '', 'Forgets every paired device.')
      : R('sys', `BT ${a[1]}`, `Bluetooth profile ${a[1]}`, 'profile', `Switches to Bluetooth profile ${a[1]}.`);
    case '&bootloader': return R('danger', 'Bootloader', 'Bootloader', 'flash mode', 'Puts the keyboard into firmware-update mode. Only use it when you plan to flash.');
    case '&bl': return R('sys', BL_NAMES[a[0]] || a[0], BL_NAMES[a[0]] || a[0], '', 'Controls the backlight.');
    case '&rgb_ug': return a[0] === 'RGB_TOG'
      ? R('sys', 'RGB on/off', 'RGB on/off', '', 'Turns the underglow lights on or off.')
      : R('sys', `RGB ${a[1]}`, `RGB effect ${a[1]}`, '', 'Sets the underglow light effect.');
    case '&studio_unlock': return R('sys', 'Studio', 'Studio unlock', '', 'Unlocks ZMK Studio so it accepts live edits.');
    default: {
      const name = b.slice(1);
      if (name === 'macro_ver') return R('macro', 'macro_ver', 'Version macro', 'macro', 'Runs the version macro from version.dtsi.');
      const m = DATA.macros.find(x => x.label === name);
      if (m) { const dn = m.display || m.label; return R('macro', dn, `Macro: ${dn}`, 'macro', `Runs the macro "${dn}".`); }
      return R('faint', raw, raw, '', 'Kept exactly as written. The editor does not understand this yet.');
    }
  }
}

/* ---------- effective bindings (pending changes applied) ---------- */
function effRaw(L, pos){
  for (let j = S.pending.length - 1; j >= 0; j--){
    const p = S.pending[j];
    if (p.bind && p.bind.L === L && p.bind.pos === pos) return p.bind.raw;
  }
  return DATA.layers[L].bindings[pos];
}
function usedCount(label){
  let n = 0;
  for (let L = 0; L < 4; L++) for (let p = 0; p < 76; p++) if (effRaw(L, p) === '&' + label) n++;
  return n;
}
function reachable(){
  const seen = new Set([0]), q = [0];
  while (q.length){
    const L = q.shift();
    for (let p = 0; p < 76; p++){
      const [b, arg] = effRaw(L, p).split(' ');
      if ((b === '&mo' || b === '&tog') && !seen.has(+arg)){ seen.add(+arg); q.push(+arg); }
    }
  }
  return seen;
}
function holdCount(){ return DATA.layers[0].bindings.filter(b => b.startsWith('&tpf ')).length; }
function problems(){
  const out = [], r = reachable();
  if (!r.has(2)) out.push({sev:'error', id:'l2',
    title:"Your Bluetooth/bootloader layer (layer 2 'mod') can't be reached. No key opens it.",
    detail:'Keys on that layer, including the Bluetooth profile keys and the bootloader, can never be used until some key switches to it.'});
  DATA.combos.forEach(c => {
    if (c.layers === null && !c.studio){
      out.push({sev:'warn', id:'c-' + c.node,
        title:`Combo '${c.node}' works on every layer`,

    title:"macro_parens isn't on any key yet",
    detail:'It is defined in macros.dtsi but nothing triggers it. Create a macro can put it on a key.'});
  return out;
}

/* ---------- diff builders (surgical, column-preserving) ---------- */
function bindingHunks(L, pos, raw){
  const sp = DATA.layers[L].spans[pos];
  const old = DATA.keymapLines[sp.line];
  const nu = old.slice(0, sp.s) + raw.padEnd(sp.e - sp.s) + old.slice(sp.e);
  return [{file:'adv360.keymap', n: sp.line + 1, minus: old, plus: [nu]}];
}
function termHunks(term){
  const i = DATA.hold.termLine, old = DATA.keymapLines[i];
  return [{file:'adv360.keymap', n: i + 1, minus: old, plus: [old.replace(/<\d+>/, `<${term}>`)]}];
}
function triggerHunks(list){
  const i = DATA.hold.triggerLine, old = DATA.keymapLines[i];
  return [{file:'adv360.keymap', n: i + 1, minus: old, plus: [old.replace(/<[\d\s]+>/, `<${list.join(' ')}>`)]}];
}
function macroHunks(m, steps){
  const lines = m.file === 'macros.dtsi' ? DATA.macroLines : DATA.keymapLines;
  const old = lines[m.line], ind = old.match(/^\s*/)[0];
  return [{file: m.file, n: m.line + 1, minus: old, plus: [ind + 'bindings = ' + steps.map(s => `<${s}>`).join(', ') + ';']}];
}

  ];
}

/* ---------- flow entries: what a finished flow will change ---------- */
function flowEntries(id, d){
  switch (id){
    case 'change': {
      const raw = rawFor(d); if (d.pos == null || !raw) return [];
      const old = DATA.layers[d.layer].bindings[d.pos], od = describe(old), nd = describe(raw);
      return [{title:`Key '${od.full}' on ${LAYER_LONG[d.layer]}: ${od.full} → ${nd.full}`, note: nd.plain,
        bind:{L:d.layer,pos:d.pos,raw}, hunks: bindingHunks(d.layer,d.pos,raw)}];
    }
    case 'hold': {
      if (d.pos == null || !d.tap || !d.hold) return [];
      const out = [], raw = `&tpf ${d.hold} ${d.tap}`;
      const od = describe(DATA.layers[d.layer].bindings[d.pos]), nd = describe(raw);
      out.push({title:`Key '${od.full}' on ${LAYER_LONG[d.layer]}: ${od.full} → ${nd.full}`, note: nd.plain,
        bind:{L:d.layer,pos:d.pos,raw}, hunks: bindingHunks(d.layer,d.pos,raw)});
      if (!DATA.hold.trigger.includes(d.pos)){
        const list = [...DATA.hold.trigger, d.pos].sort((a,b) => a - b);
        out.push({title:`Add position ${d.pos} to the hold-trigger list`, note:'Without this, holds on this key may not register.', hunks: triggerHunks(list)});
      }
      if ((d.term ?? DATA.hold.term) !== DATA.hold.term){
        out.push({title:`Hold-tap timing: ${DATA.hold.term} ms → ${d.term} ms (affects all ${holdCount()} hold-tap keys)`, note:'Shared setting for every tpf key.', hunks: termHunks(d.term)});
      }
      return out;
    }
    case 'macro': {
      if (!d.macro) return [];
      const m = DATA.macros.find(x => x.label === d.macro), out = [];
      if (JSON.stringify(d.steps) !== JSON.stringify(m.bindings)){
        out.push({title:`Macro '${m.label}' now types: ${d.steps.map(s => describe(s).full).join(', ') || 'nothing'}`,
          note:'Edits the macro definition in macros.dtsi.', hunks: macroHunks(m, d.steps)});
      }
      if (d.pos != null){
        const od = describe(DATA.layers[d.layer].bindings[d.pos]), raw = `&${m.label}`, nd = describe(raw);
        out.push({title:`Key '${od.full}' on ${LAYER_LONG[d.layer]}: ${od.full} → ${nd.full}`, note: nd.plain,
          bind:{L:d.layer,pos:d.pos,raw}, hunks: bindingHunks(d.layer,d.pos,raw)});
      }
      return out;
    }
    case 'combo': {
      if (!d.pair || d.pair.length !== 2 || !d.key) return [];
      const names = d.pair.map(p => longName(DATA.layers[0].bindings[p])).join(' + ');
      const act = describe(`&kp ${d.key}`).full, where = d.layers === 'all' ? 'every layer' : 'Base layer only';
      const ins = DATA.keymapLines.findIndex(l => l.includes('Dfffsdfa {'));
      const pos = [...d.pair].sort((x,y) => x - y).join(' ');
      const plus = ['        combo_guided {', `            bindings = <&kp ${d.key}>;`, `            key-positions = <${pos}>;`,
        ...(d.layers === 'all' ? [] : ['            layers = <0>;']), '        };', ''];
      return [{title:`Combo: ${names} → ${act} (${where})`, note:'Adds a combo to the combos block in adv360.keymap.',
        hunks:[{file:'adv360.keymap', n: ins + 1, minus: null, plus}]}];
    }
    case 'fix': {
      if (!d.fix) return [];
      const L = d.fix === 'A' ? 0 : 3, pos = d.fix === 'A' ? 61 : 0, raw = '&mo 2';
      const od = describe(DATA.layers[L].bindings[pos]), nd = describe(raw);
      const who = od.kind === 'faint' ? `Position ${pos}` : `'${od.full}'`;
      return [{title:`Key ${who} on ${LAYER_LONG[L]}: ${od.full} → ${nd.full}`, note:'Makes the Bluetooth layer reachable.',
        bind:{L,pos,raw}, hunks: bindingHunks(L,pos,raw)}];
    }
  }
  return [];
}
function rawFor(d){
  if (d.kind === 'key') return d.key ? `&kp ${d.key}` : null;
  if (d.kind === 'hold') return d.hold && d.tap ? `&tpf ${d.hold} ${d.tap}` : null;
  if (d.kind === 'layer') return (LAYER_CHOICES.find(o => o.v === d.layerOpt) || {}).raw || null;
  if (d.kind === 'macro') return d.macro ? `&${d.macro}` : null;
  if (d.kind === 'bt') return (BT_CHOICES.find(o => o.v === d.bt) || {}).raw || null;
  if (d.kind === 'trans') return '&trans';
  if (d.kind === 'none') return '&none';
  return null;
}

/* ---------- board ---------- */
const VB = (() => {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const k of DATA.keys){
    for (const [px, py] of [[k.x,k.y],[k.x+k.w,k.y],[k.x,k.y+k.h],[k.x+k.w,k.y+k.h]]){
      let X = px, Y = py;
      if (k.r){
        const a = k.r * Math.PI / 180, dx = px - k.rx, dy = py - k.ry;
        X = k.rx + dx * Math.cos(a) - dy * Math.sin(a);
        Y = k.ry + dx * Math.sin(a) + dy * Math.cos(a);
      }
      x0 = Math.min(x0, X); y0 = Math.min(y0, Y); x1 = Math.max(x1, X); y1 = Math.max(y1, Y);
    }
  }
  return [x0 - .35, y0 - .35, x1 - x0 + .7, y1 - y0 + .7];
})();
function boardSVG(sel, hl){
  const L = S.layer;
  const changed = new Set(S.pending.filter(p => p.bind && p.bind.L === L).map(p => p.bind.pos));
  const body = DATA.keys.map((k, i) => {
    const d = describe(effRaw(L, i));
    const isSel = sel.includes(i), isHl = hl.includes(i);
    const txt = SHORT(d.t);
    const fs = Math.min(.36, 1.1 / Math.max(1, txt.length * .6));
    const cx = k.x + k.w / 2, cy = k.y + k.h / 2;
    const kind = d.kind === 'raw' ? 'key' : d.kind;
    return `<g class="k k-${kind}${isSel ? ' is-sel' : ''}${isHl ? ' is-hl' : ''}" data-act="key" data-pos="${i}" tabindex="0" role="button" aria-label="Position ${i}: ${esc(d.full)}"${k.r ? ` transform="rotate(${k.r} ${k.rx} ${k.ry})"` : ''}>` +
      `<rect class="sh" x="${k.x + .02}" y="${k.y + .08}" width="${k.w - .04}" height="${k.h - .02}" rx=".17"/>` +
      `<rect class="cap" x="${k.x + .03}" y="${k.y + .02}" width="${k.w - .06}" height="${k.h - .06}" rx=".16"/>` +
      `<text x="${cx}" y="${cy + (d.s ? -.1 : 0)}" font-size="${fs.toFixed(3)}">${esc(txt)}</text>` +
      (d.s ? `<text class="sub" x="${cx}" y="${cy + .24}" font-size=".2">${esc(d.s)}</text>` : '') +
      (d.kind === 'hold' ? `<circle class="hold-dot" cx="${k.x + k.w - .15}" cy="${k.y + .17}" r=".055"/>` : '') +
      (changed.has(i) ? `<circle class="chg" cx="${k.x + .15}" cy="${k.y + .17}" r=".065"/>` : '') +
      `</g>`;
  }).join('');
  return `<svg viewBox="${VB.map(v => v.toFixed(3)).join(' ')}" role="group" aria-label="Keyboard, ${LAYER_LONG[L]}">${body}</svg>`;
}

function resultsHTML(field, q, act='choose'){
  const ql = (q || '').toLowerCase().trim();
  const list = KEYLIST.filter(k => !ql || k.n.toLowerCase().includes(ql) || k.c.toLowerCase().includes(ql) || k.alias.includes(ql)).slice(0, 14);
  if (!list.length) return '<p class="muted small">No match. Try a shorter word, like "copy" or "F5".</p>';
  const cur = S.flow ? S.flow.d[field] : null;
  return `<div class="opts">${list.map(k => `<button class="opt ${cur === k.c ? 'on' : ''}" data-act="${act}" data-f="${field}" data-v="${esc(k.c)}"><b>${esc(k.n)}</b><span>${esc(k.c)}</span></button>`).join('')}</div>`;
}
function searchBox(field, act='choose', ph='Search keys, e.g. escape, F5, copy'){
  const q = S.flow.d['q_' + field] || '';
  return `<label class="search"><span class="sr">Search keys</span><input type="search" placeholder="${esc(ph)}" value="${esc(q)}" data-in="search" data-field="${field}" data-act-name="${act}" autocomplete="off"></label>
    <div class="results" id="res-${field}">${resultsHTML(field, q, act)}</div>`;
}
function optionGrid(list, field, cur){
  return `<div class="opts">${list.map(o => `<button class="opt ${cur === o.v ? 'on' : ''}" data-act="choose" data-f="${field}" data-v="${o.v}"><b>${esc(o.t)}</b><span>${esc(o.s || '')}</span></button>`).join('')}</div>`;
}
function now(d){
  if (d.pos == null) return '';
  const x = describe(effRaw(d.layer, d.pos));
  return `<div class="now"><span class="pill">${LAYER_LONG[d.layer]} · position ${d.pos}</span><b>${esc(x.full)}</b><span class="plain">${esc(x.plain)}</span></div>`;
}
function reviewView(id, d){
  const es = flowEntries(id, d);
  if (!es.length) return '<p>Nothing to review yet. Go back and finish the earlier steps.</p>';
  const extra = (id === 'hold' && es.length > 1)
    ? '<div class="callout info">The extra lines are needed for this to work. They touch shared settings, so every hold-tap is affected.</div>' : '';
  return `<p>Here is what will change, in plain words.</p>
    <ul class="sum">${es.map(e => `<li><b>${esc(e.title)}</b>${e.note ? `<small>${esc(e.note)}</small>` : ''}</li>`).join('')}</ul>
    ${extra}
    <details class="raw"><summary>Show the raw file change</summary>${es.map(e => diffHTML(e.hunks)).join('')}</details>
    <div class="rowbtns"><button class="btn primary big" data-act="save">Add to pending changes</button></div>
    <p class="muted small" style="margin-top:12px">Nothing is written to git yet. You can remove any change from the Build screen.</p>`;
}

/* hold-tap editor (tpf) */
function tpfEditor(d){
  const term = d.term ?? DATA.hold.term, flv = d.flavor ?? 'balanced';
  const sample = DATA.layers[0].bindings[1];
  const trySample = describe(sample);
  return `<div class="tpf">
    <div class="tpf-row"><span>Tapping term</span><span><output id="termVal">${term}</output> <span class="muted small">ms</span></span></div>
    <input type="range" min="100" max="400" step="10" value="${term}" data-in="term" aria-label="Tapping term in milliseconds">
    <p class="small muted" style="margin:-4px 0 0">A press only becomes a hold after you have held it this long. Lower means holds start sooner, and accidental holds become more likely.</p>
    <fieldset class="flav"><legend>Flavor: how taps and holds compete</legend>
      ${FLAVORS.map(f => `<button class="flav-o ${flv === f.v ? 'on' : ''}" data-act="choose" data-f="flavor" data-v="${f.v}"><b>${f.t}</b><span>${f.s}</span>${f.def ? '<em>ZMK default</em>' : ''}</button>`).join('')}
    </fieldset>
    <div class="tryit">
      <button class="hold-btn" data-hold>Press and hold me</button>
      <p id="tryRes">Try a quick tap, then a long press. This example is the existing key ${esc(trySample.full)}: tap ${esc(describe(sample).t)}, hold ${esc(trySample.s.replace(' hold',''))}.</p>
    </div>
    <p class="warn-line">Hold-taps share one timing setting. Changing it here changes the ${holdCount()} existing tpf keys on your Base layer too.</p>
    <details class="raw" style="margin-top:0"><summary>What are trigger keys?</summary>
      <p class="small" style="margin-top:10px">Only these ${DATA.hold.trigger.length} positions can start a hold while a tpf key is pending: ${DATA.hold.trigger.join(', ')}. Any other key counts as a tap. Your file sets this list once for all tpf keys.</p></details>
  </div>`;
}

/* macro editor */
const PREVIEW_CH = {LPAR:'(',RPAR:')',LBKT:'[',RBKT:']',LBRC:'{',RBRC:'}',SQT:"'",DQT:'"',SPACE:' ',COMMA:',',DOT:'.',MINUS:'-',EQUAL:'=',SEMI:';',FSLH:'/',BSLH:'\\',GRAVE:'`'};
function macroPreview(steps){
  const buf = []; let c = 0;
  for (const raw of steps){
    const code = raw.replace(/^&kp /, '').trim();
    if (code === 'LEFT'){ c = Math.max(0, c - 1); continue; }
    if (code === 'RIGHT'){ c = Math.min(buf.length, c + 1); continue; }
    if (raw === '&trans' || raw === '&none') continue;
    const ch = PREVIEW_CH[code] ?? (/^[A-Z0-9]$/.test(code) ? code : null);
    const text = ch ?? `[${keyName(code)}]`;
    buf.splice(c, 0, text); c++;
  }
  const before = buf.slice(0, c).join(''), after = buf.slice(c).join('');
  return `${esc(before)}<i class="caret"></i>${esc(after)}`;
}
function macroEditor(d){
  const steps = d.steps || [];
  const rows = steps.map((raw, i) => {
    const x = describe(raw);
    return `<li class="step-row"><span class="n">${i + 1}</span><span class="sn"><b>${esc(x.full)}</b><small>${esc(raw)}</small></span>
      <button class="ib" data-act="mv" data-i="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move step up">${svgIco('up')}</button>
      <button class="ib" data-act="mv" data-i="${i}" data-dir="1" ${i === steps.length - 1 ? 'disabled' : ''} aria-label="Move step down">${svgIco('down')}</button>
      <button class="ib" data-act="rm" data-i="${i}" aria-label="Remove step">${svgIco('x')}</button></li>`;
  }).join('');
  return `<ol class="steps">${rows || '<li class="muted">No steps yet. Add one below.</li>'}</ol>
    <div class="preview"><p class="eyebrow">What it types</p><div class="typed">${macroPreview(steps) || '<span class="muted">nothing</span>'}</div>
    <p class="small muted" style="margin-top:8px">The cursor (|) shows where the text ends up. Reorder steps with the arrows; the file diff updates on the review screen.</p></div>
    <details><summary style="cursor:pointer;font-weight:650;margin-bottom:10px">Add a step</summary>${searchBox('addq','addstep','Add a key: e.g. left, shift, 9')}</details>`;
}

    {t:'Download the files', short:'Download', board:false, final:true,
      body: () => `<p>Two artifacts from the workflow. Download them and keep them somewhere safe.</p>
        <div class="dl-cards">
          <a class="dl" href="#" data-act="dl"><b>firmware-clique</b><span>Artifact from the build.yml run</span><em>Download</em></a>
          <a class="dl" href="#" data-act="dl"><b>firmware-no-clique</b><span>Artifact from the build.yml run</span><em>Download</em></a>
        </div>
        <div class="never">${svgIco('shield')}<div><b>This never flashes your keyboard.</b><p>Flashing copies a firmware file onto the Advantage360. It is a separate step that you approve on purpose, and this editor does not do it for you. Download, check, and flash only when you decide.</p></div></div>`,
      concept: '<h4>Plain words</h4><p><b>Build</b> makes the file. <b>Flash</b> installs it. The app stops before flashing on purpose, so a mistake can never reach your keyboard without you.</p>'},
  ]},
};
function defaultMsg(){
  const titles = S.pending.slice(0, 3).map(p => p.title);
  return 'Keymap: ' + (titles.length ? titles.join('; ') : 'update') + (S.pending.length > 3 ? ` (+${S.pending.length - 3} more)` : '');
}

/* ---------- flow engine ---------- */
function curStep(){ return FLOWS[S.flow.id].steps[S.flow.i]; }
function canNext(){ const st = curStep(); return st.canNext ? !!st.canNext(S.flow.d) : true; }
function startFlow(id, pre = {}, i = 0){
  S.view = 'flow';
  S.flow = {id, i, d: {...pre}};
  if (id === 'build') S.flow.d = {};
  if (id === 'fix') S.layer = 0;
  window.scrollTo(0, 0);
  render();
}
function flowAllowsPick(){ const b = curStep().board; return b === 'pick' || b === 'pair'; }
function flowPick(pos){
  const st = curStep(), d = S.flow.d;
  if (st.board === 'pick'){ d.pos = pos; d.layer = S.layer; }
  else if (st.board === 'pair'){
    const p = d.pair || [];
    d.pair = p.includes(pos) ? p.filter(x => x !== pos) : [...p, pos].slice(-2);
  }
}
function chooseVal(f, v){
  const d = S.flow.d;
  if (f === 'macro'){
    const m = DATA.macros.find(x => x.label === v);
    d.macro = v; d.steps = m ? [...m.bindings] : [];
    return;
  }
  d[f] = v;
  if (f === 'fix') S.layer = v === 'B' ? 3 : 0;
}
function saveFlow(){
  const entries = flowEntries(S.flow.id, S.flow.d);
  if (!entries.length) return;
  const wasFix = S.flow.id === 'fix';
  S.pending.push(...entries);
  S.view = 'home'; S.flow = null;
  render();
  toast(wasFix ? (reachable().has(2) ? 'Saved. Layer 2 is reachable now.' : 'Saved to pending changes.') : `Saved: ${entries.length} change${entries.length > 1 ? 's' : ''} waiting to build.`);
}
function macroMove(i, dir){
  const s = S.flow.d.steps, j = i + dir;
  if (j < 0 || j >= s.length) return;
  [s[i], s[j]] = [s[j], s[i]];
}

/* ---------- build simulation ---------- */
function commitBuild(){
  const b = S.build;
  b.phase = 'committing'; render();
  setTimeout(() => {
    b.phase = 'committed'; b.sha = '3f9a1c2'; b.backup = 'backup/2026-11-05-1412';
    render();
  }, 1000);
}
function startBuild(){
  const b = S.build;
  b.phase = 'building';
  b.jobs = [{n:'Queued on GitHub Actions', s:'wait'}, {n:'Build firmware-clique', s:'wait'}, {n:'Build firmware-no-clique', s:'wait'}, {n:'Package artifacts', s:'wait'}];
  b.logs = [];
  const script = [
    [700, ['run queued · build.yml · branch ' + b.branch]],
    [1600, ['west build -d build/left -b adv360_left -- -DZMK_CONFIG=config', 'Memory region   Used Size', 'FLASH:        ok']],
    [1400, ['west build -d build/right -b adv360_right -- -DZMK_CONFIG=config', 'Memory region   Used Size', 'FLASH:        ok']],
    [700, ['uploaded firmware-clique, firmware-no-clique']],
  ];
  let i = 0;
  const tick = () => {
    if (i > 0) b.jobs[i - 1].s = 'done';
    if (i < b.jobs.length){
      b.jobs[i].s = 'run';
      const [, lines] = script[i];
      b.logs.push(...lines);
      render();
      const delay = script[i][0];
      i++;
      setTimeout(tick, delay);
    } else {
      b.phase = 'done'; render();
    }
  };
  tick();
}

/* ---------- actions ---------- */
function act(name, ds){
  switch (name){
    case 'home': S.view = 'home'; S.flow = null; break;
    case 'theme': {
      S.theme = S.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = S.theme;
      document.querySelector('.theme').setAttribute('aria-pressed', String(S.theme === 'dark'));
      break;
    }
    case 'layer': S.layer = +ds.n; break;
    case 'key':
      if (S.view === 'flow'){ if (flowAllowsPick()) flowPick(+ds.pos); }
      else S.selKey = +ds.pos;
      break;
    case 'open': {
      if (ds.id === 'fix'){ startFlow('fix'); return; }
      if (ds.id === 'build'){ startFlow('build'); return; }
      startFlow(ds.id); return;
    }
    case 'open-fix': startFlow('fix'); return;
    case 'start-change': startFlow('change', {pos: S.selKey, layer: S.layer, kind: null}, 1); return;
    case 'next': if (canNext()) S.flow.i++; break;
    case 'prev': S.flow.i = Math.max(0, S.flow.i - 1); break;
    case 'choose': chooseVal(ds.f, ds.v); break;
    case 'cmb': S.flow.d.cSel = +ds.i; break;
    case 'addstep': S.flow.d.steps = [...(S.flow.d.steps || []), `&kp ${ds.v}`]; break;
    case 'mv': macroMove(+ds.i, +ds.dir); break;
    case 'rm': S.flow.d.steps.splice(+ds.i, 1); break;
    case 'save': saveFlow(); return;
    case 'load-sample': S.pending.push(...sampleEntries()); break;
    case 'drop': S.pending.splice(+ds.i, 1); break;
    case 'commit': commitBuild(); return;
    case 'build-start': startBuild(); return;
    case 'dl': toast('Demo: the download would start here.'); return;
  }
  render();
}

/* ---------- views ---------- */
function flowView(){
  const f = FLOWS[S.flow.id], st = curStep(), d = S.flow.d;
  const last = S.flow.i === f.steps.length - 1;
  const hasBoard = st.board !== false;
  const stepper = f.steps.map((s, i) => `<li class="${i === S.flow.i ? 'cur' : i < S.flow.i ? 'done' : ''}"><span>${i + 1}</span>${esc(s.short || s.t)}</li>`).join('');
  const concept = typeof st.concept === 'function' ? st.concept(d) : st.concept;
  const body = st.body(d);
  const side = hasBoard ? boardPanel({sel: st.sel ? st.sel(d) : [], hl: st.hl ? st.hl(d) : []}) : '';
  return `<section class="flow">
    <div class="flow-top">
      <button class="back-link" data-act="home">← All tasks</button>
      <h1>${f.title}</h1>
      <ol class="stepper">${stepper}</ol>
    </div>
    <div class="flow-grid ${hasBoard ? '' : 'solo'}">
      <div>
        <article class="step-card">
          <p class="eyebrow">Step ${S.flow.i + 1} of ${f.steps.length}</p>
          <h2>${st.t}</h2>
          ${body}
        </article>
        ${concept ? `<aside class="concept">${concept}</aside>` : ''}
        <nav class="nav">
          <button class="btn ghost" data-act="prev" ${S.flow.i === 0 ? 'disabled' : ''}>Back</button>
          ${last ? '<span></span>' : `<button class="btn primary big" data-act="next" ${canNext() ? '' : 'disabled'}>${st.next || 'Next'} ${svgIco('chev')}</button>`}
        </nav>
      </div>
      ${hasBoard ? `<div class="flow-side">${side}</div>` : ''}
    </div>
  </section>`;
}
function renderTray(){
  const n = S.pending.length;
  $('#tray').innerHTML = n ? `<span>${n} change${n > 1 ? 's' : ''} waiting for a build</span><button class="btn" data-act="open" data-id="build">Build firmware ${svgIco('chev')}</button>` : '';
}
function render(){
  document.body.dataset.view = S.view;
  $('#app').innerHTML = S.view === 'flow' ? flowView() : homeView();
  renderTray();
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(S.tt); S.tt = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  if (t.tagName === 'A') e.preventDefault();
  act(t.dataset.act, t.dataset);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-act][tabindex]')){
    e.preventDefault();
    e.target.dispatchEvent(new MouseEvent('click', {bubbles: true}));
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in === 'search'){
    const f = t.dataset.field;
    S.flow.d['q_' + f] = t.value;
    const res = document.getElementById('res-' + f);
    if (res) res.innerHTML = resultsHTML(f, t.value, t.dataset.actName);
  } else if (t.dataset.in === 'term'){
    S.flow.d.term = +t.value;
    const out = document.getElementById('termVal');
    if (out) out.textContent = t.value;
  } else if (t.dataset.in === 'branch'){
    S.build.branch = t.value;
  } else if (t.dataset.in === 'msg'){
    S.build.msg = t.value;
  }
});
/* press-and-hold demo for the hold-tap editor */
function holdDown(e){
  const b = e.target.closest && e.target.closest('[data-hold]');
  if (!b) return;
  S.hold.t0 = performance.now();
  b.classList.add('down');
  const r = document.getElementById('tryRes'); if (r) r.textContent = 'Holding…';
}
function holdUp(){
  if (!S.hold.t0) return;
  const dur = performance.now() - S.hold.t0;
  S.hold.t0 = 0;
  const b = document.querySelector('[data-hold]'); if (b) b.classList.remove('down');
  const term = (S.flow && S.flow.d.term) ?? DATA.hold.term;
  const tap = describe(DATA.layers[0].bindings[1]);
  const hold = describe(DATA.layers[0].bindings[1]);
  const r = document.getElementById('tryRes');
  if (r) r.innerHTML = dur < term
    ? `<b>Tap.</b> You held for ${Math.round(dur)} ms, under the ${term} ms term. Sends <b>${esc(tap.t)}</b>.`
    : `<b>Hold.</b> You held for ${Math.round(dur)} ms, past the ${term} ms term. Sends <b>${esc(hold.s.replace(' hold',''))}</b>.`;
}
document.addEventListener('pointerdown', holdDown);
window.addEventListener('pointerup', holdUp);
window.addEventListener('pointercancel', holdUp);

render();
</script>
</body>
</html>
