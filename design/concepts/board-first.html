<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adv360 keymap · board-first</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f2eee5; --card:#fffdf8; --card-2:#faf6ee; --ink:#1e1b16; --ink-2:#4b463b; --muted:#8b8374;
  --line:rgba(70,55,25,.14); --line-2:rgba(70,55,25,.07);
  --spot:rgba(255,255,255,.95); --dot:rgba(96,78,40,.17);
  --cap-top:#ffffff; --cap-face:#fbf8f1; --cap-side:#d2c9b4; --cap-ink:#24201a; --cap-shadow:rgba(72,52,18,.22);
  --c0:#3445d3; --c1:#0a8c77; --c2:#d68d12; --c3:#7b47d8;
  --warn:#d6402c; --ok:#17825a; --combo:#c2407f; --accent:#3445d3;
  --sans:"Instrument Sans","Helvetica Neue",system-ui,-apple-system,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --pop-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 30px 60px -18px rgba(50,35,10,.42),0 6px 14px rgba(50,35,10,.1);
  --float-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 16px 36px -16px rgba(60,40,10,.34),0 2px 6px rgba(60,40,10,.08);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e0f13; --card:#171920; --card-2:#1d2029; --ink:#ebe9e3; --ink-2:#b8b5ac; --muted:#7d7b84;
  --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.05);
  --spot:rgba(80,92,170,.2); --dot:rgba(255,255,255,.07);
  --cap-top:#3b3e49; --cap-face:#2a2d37; --cap-side:#080910; --cap-ink:#ece9e1; --cap-shadow:rgba(0,0,0,.65);
  --c0:#8f9eff; --c1:#3fd8b9; --c2:#ffbf4d; --c3:#c39dff;
  --warn:#ff6a55; --ok:#4fd49a; --combo:#ff8ab9; --accent:#8f9eff;
  --pop-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 30px 60px -18px rgba(0,0,0,.8);
  --float-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 16px 36px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
code,pre,.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.fine{font-size:12px;color:var(--muted);margin:8px 0}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;position:relative;z-index:50}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font:italic 600 22px/1 var(--serif);letter-spacing:-.01em}
.brand-sub{font:500 12px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.logo{display:inline-flex;gap:3px;align-self:center;margin-right:2px}
.logo i{width:5px;height:14px;border-radius:2px;background:var(--c0)}
.logo i:nth-child(2){background:var(--c1);height:18px}
.logo i:nth-child(3){background:var(--c2)}
.concept{font:500 11px/1 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
.branch{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font:500 12px var(--mono)}
.dot-ok{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.grow{flex:1}
.ghost-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:500}

/* stage */
.stage{position:relative;min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;padding:14px 16px 64px;
  background:
    radial-gradient(70% 55% at 50% 42%, var(--spot), transparent 70%),
    radial-gradient(var(--dot) 1px, transparent 1.3px) 0 0/22px 22px,
    var(--bg);}
.lb-wrap{position:sticky;top:12px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.layerbar{display:flex;align-items:center;gap:4px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--float-shadow);max-width:100%;overflow-x:auto}
.pills{display:flex;gap:3px}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:999px;padding:8px 14px 8px 12px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.pill:hover{transform:translateY(-1px)}
.pill .sw{width:9px;height:9px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 22%,transparent)}
.pill[aria-pressed="true"]{background:var(--pc);color:#fff;box-shadow:0 6px 16px -6px var(--pc)}
.pill[aria-pressed="true"] .sw{background:#fff;box-shadow:none}
.pill[data-l="2"][aria-pressed="true"]{color:#2a1d02}
.pill[data-l="2"][aria-pressed="true"] .sw{background:#2a1d02}
.pill.warn .sw{box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 35%,transparent);animation:blink 1.6s infinite}
.wmark{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--warn);color:#fff;font:700 11px/1 var(--sans)}
.cnt{font:600 10px/1 var(--mono);background:var(--ink);color:var(--card);border-radius:999px;padding:3px 6px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.pill-ghost{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.pill-ghost b{font:600 11px var(--mono);background:var(--combo);color:#fff;border-radius:999px;padding:2px 6px;margin-left:2px}
.pill-ghost[aria-pressed="false"]{opacity:.5}
.tip{font-size:12.5px;background:var(--ink);color:var(--card);padding:7px 12px;border-radius:12px;max-width:600px;text-align:center;opacity:0;transform:translateY(-4px);transition:.18s;pointer-events:none}
.tip.on{opacity:1;transform:none}
.pickbar{margin-top:10px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--c2) 18%,var(--card));border:1px solid color-mix(in srgb,var(--c2) 50%,transparent);padding:8px 10px 8px 16px;border-radius:999px;font-weight:600;color:var(--ink)}
.pickbar[hidden]{display:none}
.hint{margin:14px 0 0;font:500 12px var(--mono);color:var(--muted);letter-spacing:.01em}

/* board */
.boardwrap{width:100%;overflow-x:auto;overflow-y:visible;padding:18px 6px 0;margin-top:6px}
.board{position:relative;margin:0 auto;width:calc(var(--bw)*var(--u));height:calc(var(--bh)*var(--u));--hl:var(--c0)}
.key{position:absolute;left:calc(var(--x)*var(--u));top:calc(var(--y)*var(--u));width:calc(var(--w)*var(--u));height:calc(var(--h)*var(--u));
  transform:rotate(calc(var(--r)*1deg));transform-origin:0 0;background:none;border:0;padding:0;z-index:2}
.cap{position:absolute;inset:calc(var(--u)*.065);border-radius:calc(var(--u)*.17);display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--cap-top) 0%,var(--cap-face) 62%,color-mix(in srgb,var(--cap-face) 88%,var(--cap-side)) 100%);
  color:var(--cap-ink);
  box-shadow:inset 0 calc(var(--u)*.03) 0 rgba(255,255,255,.55),0 calc(var(--u)*.1) 0 var(--cap-side),0 calc(var(--u)*.2) calc(var(--u)*.28) var(--cap-shadow);
  transition:transform .12s,box-shadow .2s,opacity .25s,filter .2s;padding:0 calc(var(--u)*.05);overflow:hidden}
.key:hover .cap{transform:translateY(-2px);filter:brightness(1.03)}
.key:active .cap{transform:translateY(3px);box-shadow:inset 0 calc(var(--u)*.03) 0 rgba(255,255,255,.4),0 calc(var(--u)*.03) 0 var(--cap-side)}
.key:focus-visible{outline:none}
.key:focus-visible .cap{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.legend{font-weight:600;font-size:clamp(9px,calc(var(--u)*.23),15px);line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip;letter-spacing:-.01em}
.sub{font:500 clamp(7px,calc(var(--u)*.16),11px)/1 var(--mono);color:var(--muted);margin-bottom:calc(var(--u)*.06);white-space:nowrap}
.key.kind-trans .cap,.key.kind-none .cap{background:transparent;box-shadow:none;border:1.5px dashed var(--line);color:var(--muted)}
.key.kind-trans .cap{border-style:dotted}
.key.kind-none .legend{opacity:.4}
.key.kind-trans .legend{opacity:.5;font-weight:400}
.key.kind-layer .cap{box-shadow:inset 0 calc(var(--u)*.03) 0 rgba(255,255,255,.5),0 calc(var(--u)*.1) 0 var(--cap-side),0 0 0 calc(var(--u)*.045) var(--glow),0 0 calc(var(--u)*.6) calc(var(--u)*.02) color-mix(in srgb,var(--glow) 55%,transparent);animation:breathe 3.6s ease-in-out infinite}
.key.kind-layer .legend{color:var(--glow)}
.key.kind-layer .sub{color:var(--glow);opacity:.85}
.key.kind-hold .sub{color:var(--c1);opacity:.95}
.key.kind-macro .legend{color:var(--c3)}
.key.kind-macro .cap::before{content:"";position:absolute;left:calc(var(--u)*.14);right:calc(var(--u)*.14);top:calc(var(--u)*.08);height:calc(var(--u)*.05);border-radius:9px;background:var(--c3);opacity:.7}
.key.kind-danger .legend{color:var(--warn)}
.key.kind-bt .legend{color:color-mix(in srgb,var(--c0) 80%,var(--ink))}
.key.dirty .cap::after{content:"";position:absolute;right:calc(var(--u)*.1);top:calc(var(--u)*.1);width:calc(var(--u)*.15);height:calc(var(--u)*.15);border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}
.key.has-combo .cap::before{content:"⋈";position:absolute;left:calc(var(--u)*.1);top:calc(var(--u)*.06);font:600 calc(var(--u)*.22)/1 var(--mono);color:var(--combo)}
@keyframes breathe{50%{filter:brightness(1.07)}}
@keyframes blink{50%{opacity:.35}}
@keyframes pulse{50%{transform:translateY(-3px)}}
.board.reaching .key:not(.hl) .cap{opacity:.22;filter:saturate(.2)}
.board.reaching .key.hl .cap{animation:pulse 1.1s ease-in-out infinite;box-shadow:inset 0 calc(var(--u)*.03) 0 rgba(255,255,255,.5),0 calc(var(--u)*.1) 0 var(--cap-side),0 0 0 calc(var(--u)*.06) var(--hl),0 0 calc(var(--u)*.8) calc(var(--u)*.05) var(--hl)}
.board.picking .key .cap{cursor:crosshair}
.board.picking .key:hover .cap{box-shadow:0 0 0 calc(var(--u)*.05) var(--c2),0 calc(var(--u)*.1) 0 var(--cap-side)}

.arcs{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:4}
.arc{fill:none;stroke:var(--combo);stroke-width:.075;stroke-linecap:round;opacity:.92}
.arc.studio{stroke-dasharray:.24 .16}
.arc-hit{fill:none;stroke:transparent;stroke-width:.7;pointer-events:stroke;cursor:pointer}
.ctag{position:absolute;left:calc(var(--tx)*var(--u));top:calc(var(--ty)*var(--u));transform:translate(-50%,-50%);z-index:5;
  font:600 calc(var(--u)*.2)/1 var(--sans);white-space:nowrap;color:var(--combo);background:var(--card);border:1px solid color-mix(in srgb,var(--combo) 40%,transparent);
  border-radius:999px;padding:calc(var(--u)*.07) calc(var(--u)*.2);box-shadow:var(--float-shadow)}
.ctag.studio{color:var(--ink);border-color:var(--combo);border-style:dashed}
.ctag.studio em{font-style:normal;color:var(--combo);font-weight:700}
.nocombos .arcs,.nocombos .ctag{display:none}

/* mini board */
.board.mini .legend,.board.mini .sub{display:none}
.board.mini .key .cap{box-shadow:inset 0 calc(var(--u)*.03) 0 rgba(255,255,255,.5),0 calc(var(--u)*.08) 0 var(--cap-side)}
.board.mini .key.on .cap{background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 70%,#fff),var(--c1));box-shadow:0 0 0 calc(var(--u)*.06) color-mix(in srgb,var(--c1) 40%,transparent)}
.board.mini .key{cursor:pointer}

/* floating validator */
.card-float{position:absolute;left:28px;bottom:70px;width:318px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--float-shadow);padding:14px 15px;z-index:20}
.card-float.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.v-head{display:flex;gap:10px;align-items:flex-start}
.v-head b{font-weight:600;line-height:1.35}
.v-ico{flex:none;width:22px;height:22px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--sans);margin-top:1px}
.v-ico.ok{background:var(--ok)}
.card-float p{margin:8px 0 10px 32px;color:var(--ink-2);font-size:13px}
.v-act{display:flex;gap:8px;margin-left:32px;flex-wrap:wrap}
.v-info{margin:10px 0 0 32px;font-size:12px;color:var(--muted)}
.foot-note{margin:14px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.foot-note code{font-size:11.5px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;transition:transform .1s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px var(--accent)}
.btn.primary:disabled{box-shadow:none}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-align:left}
.icon{border:0;background:transparent;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;display:grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--line-2)}

/* changes pill */
.changes{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--card);border:0;border-radius:999px;padding:12px 20px 12px 16px;font-weight:600;box-shadow:0 18px 40px -14px rgba(0,0,0,.45);transition:transform .2s}
.changes:hover{transform:translateX(-50%) translateY(-2px)}
.changes span{opacity:.7;font-weight:500}
.changes .dot-accent{width:9px;height:9px;border-radius:50%;background:var(--c2);box-shadow:0 0 0 4px color-mix(in srgb,var(--c2) 30%,transparent)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in srgb,var(--card) 30%,transparent);border-top-color:var(--card);animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* sheet */
.sheet{position:fixed;top:68px;right:20px;bottom:92px;width:min(468px,calc(100vw - 40px));background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--pop-shadow);z-index:55;display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 40px));transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 6px}
.sh-head h2{margin:6px 0 0;font:italic 600 24px/1.1 var(--serif);letter-spacing:-.01em}
.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sh-body{flex:1;overflow:auto;padding:16px 20px}
.sh-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card-2)}
.file{font:600 12px var(--mono);color:var(--ink-2);margin:4px 0 8px;display:flex;justify-content:space-between}
.hunk{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.hh{background:var(--card-2);padding:7px 10px;font:500 11.5px var(--mono);color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.hh b{font-family:var(--sans);color:var(--ink);font-weight:600}
.dl{font:12px/1.55 var(--mono);padding:3px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.dl.minus{background:color-mix(in srgb,var(--warn) 12%,transparent);color:color-mix(in srgb,var(--warn) 85%,var(--ink))}
.dl.plus{background:color-mix(in srgb,var(--ok) 13%,transparent);color:color-mix(in srgb,var(--ok) 80%,var(--ink))}
.okbar{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--ok) 11%,transparent);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:6px}
.okbar b{color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font:500 11px var(--mono);border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--ink-2)}
.field{display:block;margin:12px 0}
.field>span{display:block;font-weight:600;margin-bottom:6px;font-size:12.5px}
input[type=text],input:not([type]),textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
textarea{min-height:70px;resize:vertical;font-family:var(--mono);font-size:12.5px}
.check{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:13px}
.build-step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.bs-ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--sans);background:var(--card-2);border:1px solid var(--line);color:var(--muted)}
.bs-ico.done{background:var(--ok);border-color:var(--ok);color:#fff}
.bs-ico.run{border-color:var(--c0);border-top-color:transparent;animation:rot .8s linear infinite}
.bar{height:6px;background:var(--line-2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c0),var(--c1));border-radius:999px;transition:width .15s}
.art{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lock{display:flex;gap:10px;margin-top:14px;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12.5px;color:var(--ink-2)}
.lock b{color:var(--ink)}

/* popover */
.pop{position:fixed;width:356px;max-height:calc(100vh - 110px);display:none;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--pop-shadow);z-index:60;overflow:hidden}
.pop.open{display:flex;animation:popin .2s cubic-bezier(.2,.8,.2,1)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.98)}}
.pop-head{padding:14px 16px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pop-head h3{margin:6px 0 0;font:italic 600 20px/1.1 var(--serif)}
.pop-now{font:500 11.5px var(--mono);color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:5px 8px;margin-top:8px;display:inline-block}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 10px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pop-body{overflow:auto;padding:4px 14px 12px;flex:1;min-height:0}
.search{margin-bottom:8px}
.mods{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.mods button{border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600}
.mods button[aria-pressed="true"]{background:var(--c1);color:#fff;border-color:transparent}
.kg-h{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.kgrid{display:flex;flex-wrap:wrap;gap:5px}
.kc{min-width:34px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card-2);padding:0 8px;font:600 12px var(--sans);box-shadow:0 2px 0 var(--cap-side)}
.kc:hover{border-color:var(--accent)}
.kc[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
.fieldsel{display:flex;gap:8px;margin-bottom:8px}
.fieldsel button{flex:1;text-align:left;border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:8px 10px}
.fieldsel button small{display:block;font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fieldsel button b{font-size:15px}
.fieldsel button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.lcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.lc{border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:10px 12px;text-align:left;font-weight:600;position:relative}
.lc i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:7px}
.lc small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:3px}
.lc[aria-pressed="true"]{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc) inset}
.lmode{display:flex;gap:6px;margin-bottom:8px}
.lmode button{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:8px;font-weight:600;font-size:12.5px}
.lmode button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.list{display:flex;flex-direction:column;gap:4px;max-height:230px;overflow:auto}
.li{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid transparent;background:var(--card-2);border-radius:10px;padding:8px 10px}
.li[aria-pressed="true"]{border-color:var(--accent)}
.li code{color:var(--muted)}
.pop-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card-2)}
.preview{font:500 11.5px var(--mono);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.preview b{color:var(--accent)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(18,15,10,.36);backdrop-filter:blur(4px);z-index:70;display:none;place-items:center;padding:16px}
.modal-bg.open{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(820px,100%);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--pop-shadow)}
.m-head{display:flex;justify-content:space-between;gap:12px;padding:20px 22px 8px}
.m-head h2{margin:6px 0 0;font:italic 600 28px/1.05 var(--serif)}
.m-body{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:8px 22px 16px}
@media (max-width:720px){.m-body{grid-template-columns:1fr}}
.sec-title{font:600 13px var(--sans);margin:4px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title span{font:500 11px var(--mono);color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 10px;cursor:grab}
.step.dragging{opacity:.4}
.step.over{border-color:var(--accent)}
.grip{color:var(--muted);font-size:15px;letter-spacing:-2px}
.idx{font:600 11px var(--mono);color:var(--muted);width:14px}
.chip-k{font-weight:700;background:var(--cap-face);border:1px solid var(--line);box-shadow:0 2px 0 var(--cap-side);color:var(--cap-ink);border-radius:9px;min-width:38px;text-align:center;padding:5px 8px;font-size:13px}
.step .code{font:500 11.5px var(--mono);color:var(--muted)}
.sx{display:flex;gap:2px}
.sx button{border:0;background:transparent;width:26px;height:26px;border-radius:8px;color:var(--muted)}
.sx button:hover:not(:disabled){background:var(--line-2);color:var(--ink)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow select{flex:1}
.preview-box{font:500 22px/1 var(--mono);background:var(--cap-face);border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;min-height:76px;display:flex;align-items:center;justify-content:center}
.caret{display:inline-block;width:2px;height:24px;background:var(--accent);margin:0 1px;animation:blink 1s steps(1) infinite}
.raw{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;margin:6px 0 0;font-size:11.5px;line-height:1.6}
.raw .m{color:var(--warn)}
.raw .p{color:var(--ok)}
.m-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.m-foot .fine{margin-right:auto}
.slider-row{display:flex;gap:12px;align-items:center}
.slider-row input{flex:1;accent-color:var(--accent)}
.slider-row output{font:600 18px var(--mono);min-width:72px;text-align:right}
.ticks{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--muted);margin:2px 0 12px}
.mini-wrap{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;justify-content:center;overflow:auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.pair div{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.pair small{display:block;font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase}
.pair b{font-size:18px}
.pad{width:100%;height:110px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,var(--cap-top),var(--cap-face));box-shadow:0 5px 0 var(--cap-side),0 14px 24px -12px var(--cap-shadow);font-weight:600;color:var(--cap-ink);margin-top:8px;touch-action:none;user-select:none}
.pad.down{transform:translateY(4px);box-shadow:0 1px 0 var(--cap-side)}
.pad-bar{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden;margin-top:10px}
.pad-bar i{display:block;height:100%;width:0;background:var(--c1)}
.pad-out{font:500 12.5px var(--mono);margin-top:8px;min-height:20px;color:var(--ink-2)}
.pad-out b{color:var(--ink)}
.seg-flavor{font-size:12.5px;color:var(--muted);margin:6px 0 12px}

/* toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* mobile */
@media (max-width:720px){
  .top{padding:0 14px;gap:10px}
  .concept,.branch{display:none}
  .stage{padding:10px 10px 90px}
  .layerbar{width:100%;justify-content:flex-start}
  .pill{padding:7px 10px}
  .hint{text-align:center;font-size:11px}
  .boardwrap{padding-top:12px}
  .card-float{position:static;width:100%;margin-top:18px}
  .stage{align-items:stretch}
  .board{margin:0}
  .foot-note{position:static;margin-top:14px}
  .sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-height:84vh;border-radius:22px 22px 0 0;transform:translateY(105%)}
  .sheet.open{transform:none}
  .pop{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-height:80vh;border-radius:22px 22px 0 0}
  .modal-bg{align-items:end;padding:0}
  .modal{border-radius:22px 22px 0 0;max-height:92vh}
  .changes{bottom:12px}
}
</style>
</head>

<script>
(() => {

const D = window.DATA;
const KF = 'adv360.keymap';
const FILES = {};

const TOKRE = /&\S+(?:[ \t]+(?!&)\S+)*/g;
const $ = (s, r = document) => r.querySelector(s);

  {name:'Numbers', codes:['NUMBER_1','NUMBER_2','NUMBER_3','NUMBER_4','NUMBER_5','NUMBER_6','NUMBER_7','NUMBER_8','NUMBER_9','NUMBER_0']},
  {name:'Symbols', codes:['EQUAL','MINUS','LBKT','RBKT','BSLH','SEMI','SQT','COMMA','DOT','FSLH','GRAVE','LPAR','RPAR','LBRC','RBRC','DQT','COLON']},
  {name:'Edit & nav', codes:['TAB','ESC','SPACE','ENTER','BSPC','DEL','INS','HOME','END','PG_UP','PG_DN','LEFT','RIGHT','UP','DOWN','CAPS']},
  {name:'Modifiers', codes:['LSHFT','RSHFT','LCTRL','RCTRL','LALT','RALT','LGUI','RGUI']},

/* ---------- keycode + binding parsing ---------- */
function kcLabel(c) {
  if (!c) return '';
  let m = /^(LG|RG|LC|RC|LS|RS|LA|RA)\((.*)\)$/.exec(c);
  if (m) return MODS[m[1]] + kcLabel(m[2]);
  if (Object.prototype.hasOwnProperty.call(KC, c)) return KC[c];
  if (/^[A-Z]$/.test(c)) return c;
  if ((m = /^(?:KP_)?N(?:UMBER_)?(\d)$/.exec(c))) return m[1];
  if (/^F\d+$/.test(c)) return c;
  return c.toLowerCase().replace(/_/g, ' ');
}
function wrapMods(code, mods) { return mods.slice().reverse().reduce((acc, m) => `${m}(${acc})`, code); }
function parse(raw) {
  const p = String(raw || '&none').trim().split(/\s+/);
  const beh = p[0].replace(/^&/, '');
  const a = p.slice(1);
  const base = {beh, args: a, raw: p.join(' ')};
  switch (beh) {
    case 'kp': {
      let c = a[0] || 'NONE', mods = [], m;
      while ((m = /^(LG|RG|LC|RC|LS|RS|LA|RA)\((.*)\)$/.exec(c))) { mods.push(m[1].replace(/^R/, 'L')); c = m[2]; }
      return {...base, kind:'kp', code:c, mods, label: kcLabel(a[0])};
    }
    case 'tpf': return {...base, kind:'hold', hold:a[0], tap:a[1], label:kcLabel(a[1]), sub: kcLabel(a[0]) + ' hold'};
    case 'mo': case 'tog': {
      const t = +a[0];

    }
    case 'trans': return {...base, kind:'trans', label:'▽'};
    case 'none': return {...base, kind:'none', label:''};
    case 'bt': {
      const c = a[0];
      if (c === 'BT_SEL') return {...base, kind:'bt', bt:'BT_SEL ' + a[1], label:'BT ' + a[1], sub:'select'};

    case 'rgb_ug': return {...base, kind:'other', label:'RGB', sub:a.join(' ').replace('RGB_','').toLowerCase()};
    case 'bootloader': return {...base, kind:'danger', label:'Boot', sub:'bootloader'};
    case 'studio_unlock': return {...base, kind:'other', label:'Studio', sub:'unlock'};
    default:
      if (D.macros.some(m => m.id === beh) || beh.startsWith('macro_')) {
        return {...base, kind:'macro', macro:beh, label: beh.replace(/^macro_/, '').replace(/_/g,' ').replace(/^./, c => c.toUpperCase()), sub:'macro'};

/* ---------- state ---------- */
const S = {
  layer: 0,
  edits: {},                                       // "l:i" -> raw
  tpf: {term: 180, flavor: D.tpf.flavor, hold: D.tpf.hold.slice()}, // seeded: term 200 -> 180 pending

const curRaw = (l, i) => (S.edits[l + ':' + i] !== undefined ? S.edits[l + ':' + i] : D.layers[l].keys[i].raw);

/* ---------- geometry (KLE-style rotation, tented halves) ---------- */
const SPLAY = 8, CTR = [9.1, 2.6], PAD = 0.45, BULGE = {combo_studio_unlock: 8.2, Dfffsdfa: -1.5};
const rad = d => d * Math.PI / 180;
const rotPt = ([x, y], [cx, cy], deg) => { const t = rad(deg), c = Math.cos(t), s = Math.sin(t), dx = x - cx, dy = y - cy; return [cx + dx * c - dy * s, cy + dx * s + dy * c]; };
const G = D.info.map((k, i) => {
  let p = [k.x, k.y];
  const r = k.r || 0;
  if (r) p = rotPt(p, [k.rx, k.ry], r);
  const hang = k.col <= 8 ? SPLAY : -SPLAY;
  p = rotPt(p, CTR, hang);
  return {i, x: p[0], y: p[1], w: k.w || 1, h: k.h || 1, rot: r + hang, row: k.row, col: k.col};
});

let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

G.forEach(g => corners(g).forEach(([x, y]) => grow(x, y)));
const hasCombo = new Set();
let ARCS = D.combos.map((c, n) => {
  const single = c.positions.length < 2;
  const A = center(G[c.positions[0]]);
  const B = single ? A : center(G[c.positions[1]]);
  const bulge = single ? 0 : (BULGE[c.name] ?? 1.2);
  const mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];

});

/* ---------- reachability + validation ---------- */
function reach(t) {

}

/* ---------- changes + diff ---------- */
function changes() {
  const out = [];
  Object.keys(S.edits).forEach(k => {
    const [l, i] = k.split(':').map(Number);
    if (S.edits[k] !== D.layers[l].keys[i].raw) out.push({t:'key', l, i});
  });
  if (S.tpf.term !== D.tpf.term) out.push({t:'term'});
  if (S.tpf.flavor !== D.tpf.flavor) out.push({t:'flavor'});
  if (S.tpf.hold.slice().sort((a,b)=>a-b).join() !== D.tpf.hold.slice().sort((a,b)=>a-b).join()) out.push({t:'hold'});

const macroLine = (text, steps) => text.replace(/bindings = .*;/, 'bindings = ' + steps.map(s => `<${s}>`).join(', ') + ';');

  const H = [], lines = new Set(), ch = changes();

    const K = D.layers[c.l].keys[c.i];

  Object.keys(groups).forEach(ln => {
    const items = groups[ln].slice().sort((a, b) => b.K.start - a.K.start);
    const orig = FILES[KF][ln - 1];
    let text = orig;
    items.forEach(({c, K}) => { text = text.slice(0, K.start) + S.edits[c.l + ':' + c.i] + text.slice(K.end); });
    const title = items.slice().reverse().map(({c, K}) => `${LN[c.l]} #${c.i} ${parse(K.raw).label} → ${parse(S.edits[c.l + ':' + c.i]).label}`).join(' · ');

/* ---------- bake (commit) ---------- */
function bake() {

  });
  if (S.tpf.term !== D.tpf.term) {
    kf[D.tpf.termLine - 1] = kf[D.tpf.termLine - 1].replace(/<\d+>/, `<${S.tpf.term}>`);
    D.tpf.term = S.tpf.term;

  const holdSorted = S.tpf.hold.slice().sort((a,b)=>a-b);
  if (holdSorted.join() !== D.tpf.hold.slice().sort((a,b)=>a-b).join()) {
    kf[D.tpf.holdLine - 1] = kf[D.tpf.holdLine - 1].replace(/=\s*<[^>]*>/, `= <${holdSorted.join(' ')}>`);
    D.tpf.hold = holdSorted;
  }
  if (S.tpf.flavor !== D.tpf.flavor) {
    const ind = kf[D.tpf.termLine - 1].match(/^\s*/)[0];
    const line = ind + `flavor = "${S.tpf.flavor}";`;
    if (D.tpf.flavorLine == null) {
      const at = D.tpf.termLine;
      kf.splice(at, 0, line);
      D.layers.forEach(L => L.keys.forEach(K => { if (K.line > at) K.line++; }));
      D.macros.forEach(m => { if (m.file === KF && m.line > at) m.line++; });
      if (D.tpf.holdLine > at) D.tpf.holdLine++;
      D.tpf.flavorLine = at + 1;
    } else kf[D.tpf.flavorLine - 1] = line;
    D.tpf.flavor = S.tpf.flavor;
  }
  Object.keys(S.macros).forEach(id => {
    const m = macroById(id), steps = S.macros[id];
    if (steps.join('|') === m.steps.join('|')) return;
    FILES[m.file][m.line - 1] = macroLine(FILES[m.file][m.line - 1], steps);
    m.steps = steps.slice();
  });

}

/* ---------- key popover ---------- */
const TABS = [['kp','Key press'],['hold','Hold-tap'],['layer','Layer'],['macro','Macro'],['bt','Bluetooth'],['trans','Transparent'],['none','None']];
function draftFrom(l, i) {
  const p = parse(curRaw(l, i));
  const d = {tab: p.kind === 'kp' ? 'kp' : p.kind === 'hold' ? 'hold' : p.kind === 'layer' ? 'layer' : p.kind === 'macro' ? 'macro' : p.kind === 'bt' ? 'bt' : p.kind === 'trans' ? 'trans' : p.kind === 'none' ? 'none' : 'kp',
    kpCode: p.kind === 'kp' ? p.code : 'A', mods: p.kind === 'kp' ? p.mods.slice() : [],
    hold: p.kind === 'hold' ? p.hold : 'F1', tap: p.kind === 'hold' ? p.tap : 'A', field: 'tap',
    layerT: p.kind === 'layer' ? p.target : 1, layerMode: p.kind === 'layer' && p.mode === 'tog' ? 'tog' : 'mo',
    macroId: p.kind === 'macro' ? p.macro : (D.macros[0] || {}).id, bt: p.kind === 'bt' ? p.bt : 'BT_SEL 0',
    search: '', touched: false};
  return d;
}
function buildRaw(d) {
  switch (d.tab) {
    case 'kp': return '&kp ' + wrapMods(d.kpCode, d.mods);
    case 'hold': return `&tpf ${d.hold} ${d.tap}`;
    case 'layer': return d.layerMode === 'mo' ? `&mo ${d.layerT}` : `&tog ${d.layerT}`;
    case 'macro': return '&' + d.macroId;
    case 'bt': return '&bt ' + d.bt;
    case 'trans': return '&trans';
    default: return '&none';
  }
}
function keyGrid(d) {

function placePop(anchor) {

/* ---------- sheet: diff / commit / build ---------- */
function renderSheet() {
  const ch = changes(), sheet = $('#sheet'), t = S.sheetTab, b = S.build;
  const title = ch.length ? `${ch.length} pending change${ch.length > 1 ? 's' : ''}` : 'Nothing pending';
  let body = '', foot = '';
  if (t === 'diff') {
    const {H, lines} = hunks();
    body = H.length ? H.map(h => `<div class="file"><span>${h.file}</span><span class="muted">line ${h.ln}</span></div>
        <div class="hunk"><div class="hh"><b>${esc(h.title)}</b><span>@@ ${h.ln} @@</span></div>
        ${h.minus.map(x => `<div class="dl minus">- ${esc(x)}</div>`).join('')}${h.plus.map(x => `<div class="dl plus">+ ${esc(x)}</div>`).join('')}</div>`).join('') +
        `<div class="okbar"><span>✓</span><span><b>Round-trip safe.</b> Only ${lines} line${lines > 1 ? 's' : ''} of ${FILES[KF].length} changed. Comments, <code>#include</code>, <code>#if/#endif</code> and column alignment elsewhere are byte-identical.</span></div>`
      : `<p class="fine" style="font-size:13px">The board matches the committed keymap. Edit a key to see its patch here.</p>` +
        `<div class="okbar"><span>✓</span><span><b>Round-trip safe.</b> Parse and serialize with no edits give back the same bytes.</span></div>`;
    body += `<div class="chips"><span class="chip">raw, read-only: #include "version.dtsi"</span><span class="chip">raw: #ifndef VERSION_MACRO</span></div>`;
    foot = `<button class="btn ghost" type="button" data-act="discard" ${ch.length ? '' : 'disabled'}>Discard</button>` +
      `<button class="btn primary" type="button" data-tab="commit" ${ch.length ? '' : 'disabled'}>Continue to commit →</button>`;
  } else if (t === 'commit') {
    if (!S.msg) S.msg = `keymap: ${ch.filter(c => c.t === 'key').length} key edit${ch.filter(c => c.t === 'key').length === 1 ? '' : 's'}${ch.some(c => c.t !== 'key') ? ', tpf tuning' : ''}`;
    body = `<label class="field"><span>Branch</span><input type="text" data-role="branch" value="${esc(S.branch)}"></label>
      <label class="field"><span>Commit message</span><textarea data-role="msg">${esc(S.msg)}</textarea></label>
      <label class="check"><input type="checkbox" data-role="backup" ${S.backup ? 'checked' : ''}> Create backup branch <code>backup/V3.0-${D.lastSha}</code> first</label>
      <p class="fine">Base <code>V3.0</code> · author Ali Aljufairi · ${ch.length} change${ch.length === 1 ? '' : 's'} to <code>adv360.keymap</code>${ch.some(c => c.t === 'macro') ? ' and <code>macros.dtsi</code>' : ''}</p>
      <button class="btn primary wide" type="button" data-act="commit" ${ch.length ? '' : 'disabled'}>Commit and push to ${esc(S.branch)}</button>
      <p class="fine">Pushing starts <code>build.yml</code>. It never flashes your keyboard.</p>`;
  } else {
    const done = b.stage === 'done';
    const committed = b.stage && b.stage !== 'idle';
    const pushed = committed && b.stage !== 'committing';
    const built = b.stage === 'done';
    const step = (ico, title, sub, extra = '') => `<div class="build-step"><span class="bs-ico ${ico}">${ico === 'done' ? '✓' : ico === 'run' ? '' : '·'}</span><div><b>${title}</b><div class="fine" style="margin:2px 0 0">${sub}</div>${extra}</div></div>`;
    if (!committed) {
      body = `<p class="fine" style="font-size:13px">Last build: <b>run #${D.lastRun}</b> · success · V3.0 <code>${D.lastSha}</code></p>` +
        step('', 'Commit', 'Commit your changes to a branch to start a build.') +
        step('', 'Build', 'GitHub Actions <code>build.yml</code> compiles both halves: <code>firmware-clique</code> and <code>firmware-no-clique</code>.') +

    } else {
      body = step(committed ? 'done' : 'run', 'Committed', `<code>${b.sha}</code> on <code>${esc(b.branch)}</code>`) +
        step(pushed ? 'done' : 'run', 'Pushed', `to <code>origin/${esc(b.branch)}</code>`) +
        step(built ? 'done' : pushed ? 'run' : '', `Build #${b.run} · build.yml`, built ? 'success · 3m 12s' : `running · ${b.pct || 0}%`,
          pushed ? `<div class="bar"><i style="width:${built ? 100 : b.pct || 0}%"></i></div>` : '') +

    }

  }

    <nav class="tabs" role="tablist">${[['diff','Diff'],['commit','Commit'],['build','Build']].map(([id, l]) => `<button type="button" role="tab" data-tab="${id}" aria-selected="${t === id}">${l}</button>`).join('')}</nav>
    <div class="sh-body">${body}</div>${foot ? `<footer class="sh-foot">${foot}</footer>` : ''}`;
  sheet.classList.toggle('open', S.sheet);
}
function lockNote() {
  return `<div class="lock"><span>🔒</span><span><b>Never flashes your keyboard.</b> Flashing is a separate step you do yourself: put the keyboard in bootloader, copy the .uf2 over. ZMK Studio edits on the keyboard can override this build until you flash.</span></div>`;
}
let buildTimer = null;
function commit() {
  if (!changes().length) return;
  const sha = 'b71d4e2';
  bake();
  S.build = {stage: 'committing', sha, branch: S.branch, run: D.lastRun + 1, pct: 0};
  S.msg = '';
  S.sheetTab = 'build';
  renderAll();
  setTimeout(() => { S.build.stage = 'pushing'; renderAll(); }, 650);
  setTimeout(() => {
    S.build.stage = 'building'; renderAll();
    clearInterval(buildTimer);
    buildTimer = setInterval(() => {
      S.build.pct = Math.min(100, S.build.pct + 4);
      if (S.build.pct >= 100) { clearInterval(buildTimer); S.build.stage = 'done'; toast('Build succeeded · artifacts ready. Nothing was flashed.'); }
      renderAll();
    }, 120);
  }, 1500);
}
function discard() {
  S.edits = {}; S.tpf = {term: D.tpf.term, flavor: D.tpf.flavor, hold: D.tpf.hold.slice()}; S.macros = {};
  toast('Discarded pending changes');
  renderAll();
}

/* ---------- modal: macro + hold-tap ---------- */
const KEY_OPTS = () => KEY_GROUPS.map(g => `<optgroup label="${g.name}">` + g.codes.map(c => `<option value="${c}">${esc(kcLabel(c))}  (${c})</option>`).join('') + '</optgroup>').join('');
function simulate(steps) {
  let buf = '', caret = 0;
  const CH = {LPAR:'(',RPAR:')',LBKT:'[',RBKT:']',LBRC:'{',RBRC:'}',SQT:"'",DQT:'"',SPACE:' ',COMMA:',',DOT:'.',EQUAL:'=',MINUS:'-',FSLH:'/',SEMI:';',GRAVE:'`',BSLH:'\\'};
  steps.forEach(s => {
    const code = s.replace(/^&kp\s+/, '');
    if (code === 'LEFT') { caret = Math.max(0, caret - 1); return; }
    if (code === 'RIGHT') { caret = Math.min(buf.length, caret + 1); return; }
    if (code === 'BSPC') { if (caret > 0) { buf = buf.slice(0, caret - 1) + buf.slice(caret); caret--; } return; }
    let ch = null;
    if (CH[code] !== undefined) ch = CH[code];
    else if (/^[A-Z]$/.test(code)) ch = code.toLowerCase();
    else if (/^NUMBER_\d$/.test(code)) ch = code.slice(7);
    if (ch !== null) { buf = buf.slice(0, caret) + ch + buf.slice(caret); caret += ch.length; }
  });
  return [buf.slice(0, caret), buf.slice(caret)];
}
function openMacro(id) {
  const m = macroById(id);
  if (!m) return;
  S.pop = null; closePop();
  S.mdl = {type: 'macro', id, steps: (S.macros[id] || m.steps).slice()};
  renderModal(); showModal(true);
}
function openTpf() {
  S.mdl = {type: 'tpf', term: S.tpf.term, flavor: S.tpf.flavor, hold: S.tpf.hold.slice(), padPos: 15, tap: 0, t0: 0};
  closePop(); renderModal(); showModal(true);
}
function showModal(on) { $('#modalbg').classList.toggle('open', on); if (!on) S.mdl = null; }
const FLAVOR_DESC = {
  'balanced': 'ZMK default. A hold is decided by timing, and a tap is decided when another key is pressed.',
  'hold-preferred': 'Holds win as soon as another key is pressed while this key is down.',
  'tap-preferred': 'Taps win if another key is pressed before the term expires. Good for home-row mods.',
  'tap-unless-interrupted': 'Taps win unless another key is pressed while this key is held. The strictest tap default.'
};
function macroModalHTML(M) {
  const m = macroById(M.id);
  const [before, after] = simulate(M.steps);
  const origLine = FILES[m.file][m.line - 1];
  const newLine = macroLine(origLine, M.steps);
  const changed = M.steps.join('|') !== m.steps.join('|');
  return `<div class="m-head"><div><div class="eyebrow">Macro · zmk,behavior-macro · ${m.file} line ${m.line}</div><h2>${esc(m.display)}</h2>` +
    `<code class="muted">&amp;${esc(M.id)} · ${M.steps.length} steps</code></div><button class="icon" type="button" data-m="close" aria-label="Close">×</button></div>
    <div class="m-body">
      <section>
        <div class="sec-title">Steps <span>taps in order, top to bottom</span></div>
        <ol class="steps">${M.steps.map((s, idx) => {
          const code = s.replace(/^&kp\s+/, '');
          const lab = s.startsWith('&kp ') ? kcLabel(code) : s.replace('&', '');
          return `<li class="step" draggable="true" data-si="${idx}"><span class="grip">⠿</span><span class="idx">${idx + 1}</span>` +
            `<span style="display:flex;align-items:center;gap:8px"><span class="chip-k">${esc(lab)}</span><span class="code">${esc(s)}</span></span>` +
            `<span class="sx"><button type="button" data-m="up" data-si="${idx}" ${idx === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button type="button" data-m="down" data-si="${idx}" ${idx === M.steps.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></span>` +
            `<span class="sx"><button type="button" data-m="del" data-si="${idx}" aria-label="Remove">×</button></span></li>`;
        }).join('')}</ol>
        <div class="addrow"><select id="addSel">${KEY_OPTS()}</select><button class="btn" type="button" data-m="add">+ Add tap</button></div>
      </section>
      <section>
        <div class="sec-title">Result preview</div>
        <div class="preview-box"><span>${esc(before)}</span><i class="caret"></i><span>${esc(after)}</span></div>
        <p class="fine">Simulated in a plain text field. Reorder the steps and the result changes, so the order is part of the macro.</p>
        <div class="sec-title">Raw diff <span>${changed ? 'pending' : 'no change'}</span></div>
        <pre class="raw">${changed ? `<span class="m">- ${esc(origLine)}</span>\n<span class="p">+ ${esc(newLine)}</span>` : `  ${esc(origLine)}`}</pre>
      </section>
    </div>
    <div class="m-foot"><span class="fine">Saved into <code>${m.file}</code>. Nothing is flashed.</span><button class="btn ghost" type="button" data-m="close">Cancel</button><button class="btn primary" type="button" data-m="save-macro" ${changed ? '' : 'disabled'}>Save macro</button></div>`;
}
function tpfModalHTML(M) {
  const used = D.layers.reduce((n, L) => n + L.keys.filter(K => parse(K.raw).kind === 'hold').length, 0);
  const origTerm = FILES[KF][D.tpf.termLine - 1];
  const newTerm = origTerm.replace(/<\d+>/, `<${M.term}>`);
  return `<div class="m-head"><div><div class="eyebrow">Hold-tap · zmk,behavior-hold-tap · ${KF} line ${D.tpf.termLine}</div><h2>tpf</h2>` +
    `<code class="muted">&amp;tpf · ${used} keys use it across layers</code></div><button class="icon" type="button" data-m="close" aria-label="Close">×</button></div>
    <div class="m-body">
      <section>
        <div class="sec-title">Timing</div>
        <div class="slider-row"><input type="range" id="term" min="100" max="400" step="5" value="${M.term}"><output id="termOut">${M.term} ms</output></div>
        <div class="ticks"><span>100</span><span>ZMK default 200</span><span>400</span></div>
        <label class="field" style="margin-top:4px"><span>Flavor</span><select id="flavor">${Object.keys(FLAVOR_DESC).map(f => `<option value="${f}" ${M.flavor === f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
        <p class="seg-flavor" id="flavorDesc">${FLAVOR_DESC[M.flavor]}</p>
        <div class="sec-title">Hold-trigger positions <span id="holdCount">${M.hold.length} keys</span></div>
        <div class="mini-wrap" id="mini">${miniBoard(M.hold)}</div>
        <p class="fine">Tap a key to toggle whether a press on it can become a hold. Keys outside the set always tap.</p>
      </section>
      <section>
        <div class="sec-title">Try it <span>simulated</span></div>
        <div class="pair"><div><small>Hold</small><b>per key</b></div><div><small>Tap</small><b>per key</b></div></div>
        <p class="fine" style="margin-top:-4px">Each <code>&amp;tpf</code> key sets its own hold and tap, e.g. <code>&amp;tpf F1 NUMBER_1</code>.</p>
        <label class="field" style="margin-top:6px"><span>Simulated press on</span><select id="padPos">${G.map(g => `<option value="${g.i}" ${M.padPos === g.i ? 'selected' : ''}>#${g.i} ${esc(parse(curRaw(0, g.i)).label)}</option>`).join('')}</select></label>
        <button class="pad" id="pad" type="button">Press and hold</button>
        <div class="pad-bar"><i id="padFill"></i></div>
        <div class="pad-out" id="padOut">Press and release quickly for a tap, or hold past the term.</div>
        <div class="sec-title" style="margin-top:14px">Raw diff</div>
        <pre class="raw" id="rawTpf">${M.term !== D.tpf.term ? `<span class="m">- ${esc(origTerm)}</span>\n<span class="p">+ ${esc(newTerm)}</span>` : `  ${esc(origTerm)}`}</pre>
      </section>
    </div>
    <div class="m-foot"><span class="fine">Global to every <code>&amp;tpf</code> key. Nothing is flashed.</span><button class="btn ghost" type="button" data-m="close">Cancel</button><button class="btn primary" type="button" data-m="save-tpf">Save hold-tap</button></div>`;
}
function miniBoard(holdSet) {
  let h = `<div class="board mini" style="--bw:${BW.toFixed(3)};--bh:${BH.toFixed(3)};--u:19px;width:calc(var(--bw)*var(--u));height:calc(var(--bh)*var(--u));margin:0 auto">`;
  G.forEach(g => {
    h += `<button type="button" class="key${holdSet.includes(g.i) ? ' on' : ''}" data-pos="${g.i}" aria-label="position ${g.i}" aria-pressed="${holdSet.includes(g.i)}" style="--x:${g.x.toFixed(3)};--y:${g.y.toFixed(3)};--w:${g.w};--h:${g.h};--r:${g.rot.toFixed(3)}"><span class="cap"><span class="legend"></span></span></button>`;
  });
  return h + '</div>';
}
function renderModal() {
  const M = S.mdl;
  if (!M) return;
  $('#modal').innerHTML = M.type === 'macro' ? macroModalHTML(M) : tpfModalHTML(M);
}
function padTick() {
  const M = S.mdl; if (!M || !M.down) return;
  const el = performance.now() - M.t0;
  $('#padFill').style.width = Math.min(100, el / M.term * 100) + '%';
  $('#padOut').innerHTML = `${Math.round(el)} ms`;
  M.raf = requestAnimationFrame(padTick);
}
function padResult() {
  const M = S.mdl, el = performance.now() - M.t0;
  const p = parse(curRaw(0, M.padPos));
  const isHold = M.hold.includes(M.padPos) && el >= M.term && p.kind === 'hold';
  const isTpf = p.kind === 'hold';
  if (!isTpf) return `<b>Not a hold-tap key.</b> #${M.padPos} on Default is ${esc(p.label)}, so it just sends its key.`;
  return isHold ? `<b>Hold</b> after ${Math.round(el)} ms → <code>&amp;kp ${esc(p.hold)}</code>` : `<b>Tap</b> after ${Math.round(el)} ms → <code>&amp;kp ${esc(p.tap)}</code>`;
}

/* ---------- events ---------- */
const board = $('#board');
board.addEventListener('click', e => {
  const k = e.target.closest('.key');
  if (k) {
    const i = +k.dataset.i;
    if (S.pick) { openKey(S.layer, i, k, {assign: true, draft: {tab: 'layer', layerT: S.pick.target, layerMode: 'mo'}}); return; }
    openKey(S.layer, i, k); return;
  }
  const c = e.target.closest('[data-combo]');
  if (c) { openCombo(+c.dataset.combo, c); }
});
$('#pills').addEventListener('click', e => {
  const b = e.target.closest('[data-l]'); if (b) setLayer(+b.dataset.l);
});
$('#pills').addEventListener('pointerover', e => {
  const b = e.target.closest('[data-l]'); if (b) highlightReach(+b.dataset.l);
});
$('#pills').addEventListener('pointerleave', () => highlightReach(null));
$('#combosBtn').addEventListener('click', () => { S.showCombos = !S.showCombos; renderPills(); });
$('#pickCancel').addEventListener('click', () => { S.pick = null; renderAll(); });
$('#validator').addEventListener('click', e => {
  if (e.target.closest('[data-act="fix"]')) { S.layer = 0; S.pick = {target: 2}; closePop(); renderAll(); toast('Pick any key on Default'); }
});
$('#changes').addEventListener('click', () => { S.sheet = !S.sheet; if (S.sheet) renderSheet(); else $('#sheet').classList.remove('open'); });
$('#sheet').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { S.sheetTab = t.dataset.tab; renderSheet(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'close-sheet') { S.sheet = false; $('#sheet').classList.remove('open'); }
  if (act === 'discard') discard();
  if (act === 'commit') commit();
});
$('#sheet').addEventListener('input', e => {
  if (e.target.dataset.role === 'branch') S.branch = e.target.value;
  if (e.target.dataset.role === 'msg') S.msg = e.target.value;
});
$('#sheet').addEventListener('change', e => {
  if (e.target.dataset.role === 'backup') S.backup = e.target.checked;
});
$('#pop').addEventListener('input', e => {
  if (!S.pop || S.pop.mode !== 'key' || e.target.dataset.role !== 'search') return;
  S.pop.d.search = e.target.value;
  const g = $('#keygrid'); if (g) g.innerHTML = keyGrid(S.pop.d);
});
$('#pop').addEventListener('click', e => {
  const P = S.pop; if (!P) return;
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act === 'close') return closePop();
  if (P.mode !== 'key') return;
  const d = P.d;
  const set = fn => { fn(); d.touched = true; renderPop(); };
  if (b.dataset.tab) return set(() => { d.tab = b.dataset.tab; });
  if (b.dataset.kc) return set(() => { if (d.tab === 'hold') d[d.field] = b.dataset.kc; else d.kpCode = b.dataset.kc; });
  if (b.dataset.mod) return set(() => { d.mods = d.mods.includes(b.dataset.mod) ? d.mods.filter(x => x !== b.dataset.mod) : [...d.mods, b.dataset.mod]; });
  if (b.dataset.field) return set(() => { d.field = b.dataset.field; d.search = ''; });
  if (b.dataset.lt) return set(() => { d.layerT = +b.dataset.lt; });
  if (b.dataset.lm) return set(() => { d.layerMode = b.dataset.lm; });
  if (b.dataset.mac) return set(() => { d.macroId = b.dataset.mac; });
  if (b.dataset.bt) return set(() => { d.bt = b.dataset.bt; });
  switch (b.dataset.act) {
    case 'apply': return applyPop();
    case 'reset': P.d = draftFrom(P.l, P.i); return renderPop();
    case 'open-tpf': return openTpf();
    case 'open-macro': return openMacro(d.macroId);
  }
});
$('#modalbg').addEventListener('click', e => {
  if (e.target.id === 'modalbg') return showModal(false);
  const M = S.mdl; if (!M) return;
  const pos = e.target.closest('[data-pos]');
  if (pos && M.type === 'tpf') {
    const i = +pos.dataset.pos;
    M.hold = M.hold.includes(i) ? M.hold.filter(x => x !== i) : [...M.hold, i];
    $('#mini').innerHTML = miniBoard(M.hold);
    $('#holdCount').textContent = M.hold.length + ' keys';
    return;
  }
  const b = e.target.closest('[data-m]'); if (!b || b.disabled) return;
  const act = b.dataset.m, si = +b.dataset.si;
  if (act === 'close') return showModal(false);
  if (M.type === 'macro') {
    if (act === 'up') { [M.steps[si - 1], M.steps[si]] = [M.steps[si], M.steps[si - 1]]; }
    if (act === 'down') { [M.steps[si + 1], M.steps[si]] = [M.steps[si], M.steps[si + 1]]; }
    if (act === 'del') M.steps.splice(si, 1);
    if (act === 'add') M.steps.push('&kp ' + $('#addSel').value);
    if (act === 'save-macro') {
      S.macros[M.id] = M.steps.slice();
      if (S.macros[M.id].join('|') === macroById(M.id).steps.join('|')) delete S.macros[M.id];
      showModal(false); toast(`${M.id} updated`); renderAll(); return;
    }
    if (['up','down','del','add'].includes(act)) renderModal();
  } else {
    if (act === 'save-tpf') {
      S.tpf = {term: M.term, flavor: M.flavor, hold: M.hold.slice()};
      showModal(false); toast(`tpf: tapping-term ${M.term} ms · ${M.flavor}`); renderAll(); return;
    }
  }
});
// macro drag reorder
let dragFrom = null;
$('#modal').addEventListener('dragstart', e => {
  const s = e.target.closest('.step'); if (!s) return;
  dragFrom = +s.dataset.si; s.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragFrom));
});
$('#modal').addEventListener('dragover', e => {
  const s = e.target.closest('.step'); if (!s) return;
  e.preventDefault();
  $$('.step').forEach(x => x.classList.toggle('over', x === s));
});
$('#modal').addEventListener('dragend', () => { $$('.step').forEach(x => x.classList.remove('dragging', 'over')); dragFrom = null; });
$('#modal').addEventListener('drop', e => {
  const s = e.target.closest('.step'); const M = S.mdl;
  if (!s || !M || M.type !== 'macro' || dragFrom == null) return;
  e.preventDefault();
  const to = +s.dataset.si;
  const [item] = M.steps.splice(dragFrom, 1);
  M.steps.splice(to, 0, item);
  dragFrom = null; renderModal();
});
// modal: range + flavor (in-place updates so the slider stays smooth)
$('#modal').addEventListener('input', e => {
  const M = S.mdl; if (!M || M.type !== 'tpf') return;
  if (e.target.id === 'term') {
    M.term = +e.target.value;
    $('#termOut').textContent = M.term + ' ms';
    const orig = FILES[KF][D.tpf.termLine - 1];
    $('#rawTpf').innerHTML = M.term !== D.tpf.term ? `<span class="m">- ${esc(orig)}</span>\n<span class="p">+ ${esc(orig.replace(/<\d+>/, `<${M.term}>`))}</span>` : `  ${esc(orig)}`;
  }
});
$('#modal').addEventListener('change', e => {
  const M = S.mdl; if (!M || M.type !== 'tpf') return;
  if (e.target.id === 'flavor') { M.flavor = e.target.value; $('#flavorDesc').textContent = FLAVOR_DESC[M.flavor]; }
  if (e.target.id === 'padPos') M.padPos = +e.target.value;
});
document.addEventListener('pointerdown', e => {
  const p = e.target.closest && e.target.closest('#pad');
  if (!p || !S.mdl) return;
  const M = S.mdl; M.down = true; M.t0 = performance.now(); p.classList.add('down');
  cancelAnimationFrame(M.raf); padTick();
});
document.addEventListener('pointerup', () => {
  const M = S.mdl; if (!M || !M.down) return;
  M.down = false; cancelAnimationFrame(M.raf);
  $('#pad').classList.remove('down'); $('#padFill').style.width = '0';
  $('#padOut').innerHTML = padResult();
});
document.addEventListener('pointerdown', e => {
  if (!S.pop) return;
  if (e.target.closest('#pop, .key, [data-combo], #modal')) return;
  closePop();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.mdl) return showModal(false);
    if (S.pop) return closePop();
    if (S.pick) { S.pick = null; renderAll(); return; }
    if (S.sheet) { S.sheet = false; $('#sheet').classList.remove('open'); }
    return;
  }
  if (/input|textarea|select/i.test(document.activeElement.tagName) || S.mdl) return;
  if (['1','2','3','4'].includes(e.key)) setLayer(+e.key - 1);
});
$('#theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('#theme').textContent = dark ? 'Light' : 'Dark';
});
window.addEventListener('resize', () => { layoutBoard(); if (S.pop && S.pop.mode) placePop(board.querySelector(`[data-i="${S.pop.i}"]`)); });

/* seed with the real layer-0 layout and open the sheet state consistently */
renderAll();
})();
</script>
</body>
</html>
